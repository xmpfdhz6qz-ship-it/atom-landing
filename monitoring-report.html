<!DOCTYPE html>
<html>
<head>
  <title>Atom Foundry Report</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body style="font-family: Arial; padding: 20px; max-width: 800px; margin: auto;">

  <h1 id="store"></h1>
  <h2 id="score"></h2>
  <p id="loss"></p>
  <p id="drop"></p>

  <h3>Issues:</h3>
  <ul id="issues"></ul>

<script>
// ✅ FIX: vezmeme token z URL path (/monitoring-report/{token})
const pathParts = window.location.pathname.split("/");
const token = pathParts[pathParts.length - 1];

// DEBUG
if (!token || token === "undefined") {
  document.body.innerHTML = "Missing token";
}

// FETCH
fetch(`https://n8n-production-d989b.up.railway.app/webhook/monitoring?token=${token}`)
  .then(res => res.json())
  .then(data => {

    console.log("DATA:", data);

    if (!data || !data.store) {
      document.body.innerHTML = "No data found";
      return;
    }

    document.getElementById("store").innerText = data.store;
    document.getElementById("score").innerText = "Score: " + (data.score ?? 0);
    document.getElementById("loss").innerText = "Estimated loss: $" + (data.monthly_loss ?? 0);

    document.getElementById("drop").innerText = data.drop 
      ? "Recent drop: -" + data.drop + " points"
      : "";

    const issues = document.getElementById("issues");
    issues.innerHTML = "";

    if (data.issues && data.issues.length > 0) {
      data.issues.forEach(i => {
        const li = document.createElement("li");
        li.innerText = i;
        issues.appendChild(li);
      });
    } else {
      const li = document.createElement("li");
      li.innerText = "No major issues detected";
      issues.appendChild(li);
    }

  })
  .catch(err => {
    console.error(err);
    document.body.innerHTML = "Error loading data";
  });
</script>

<!-- SITE_VISIT_TRACKER:START -->
<script>
(function(){
  try {
    if (navigator.doNotTrack === '1' || window.doNotTrack === '1' || navigator.msDoNotTrack === '1') return;
    var VID_KEY = 'af_vid';
    var vid = localStorage.getItem(VID_KEY);
    if (!vid) {
      vid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
      localStorage.setItem(VID_KEY, vid);
    }
    var payload = JSON.stringify({
      visitor_id: vid,
      path: location.pathname,
      referrer: document.referrer || '',
      user_agent: navigator.userAgent || ''
    });
    var url = 'https://n8n-production-1d7c.up.railway.app/webhook/site-visit';
    if (navigator.sendBeacon) {
      navigator.sendBeacon(url, new Blob([payload], { type: 'application/json' }));
    } else {
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(function(){});
    }
  } catch (e) {}
})();
</script>
<!-- SITE_VISIT_TRACKER:END -->
</body>
</html>
