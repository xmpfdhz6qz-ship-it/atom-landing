<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scan in Progress – Atom Foundry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .box {
      max-width: 520px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .highlight {
      color: #f87171;
      font-weight: 600;
      margin-top: 10px;
    }

    .muted {
      font-size: 13px;
      color: #64748b;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🔍 Your scan is running…</h1>

    <p>
      We're analyzing your store right now.
    </p>

    <p>
      You’ll receive your report in the next 1–2 minutes.<br>
      (Check spam or promotions if you don’t see it)
    </p>

    <p class="highlight">
      ⚠️ Your store is likely losing revenue right now
    </p>

    <p class="muted">
      Our AI is scanning your store structure, messaging, and conversion flow.
    </p>

  </div>

</body>
</html>
