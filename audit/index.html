<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Recommendation Audit – Atom Foundry</title>
<meta name="robots" content="noindex, nofollow">
<style>

/* ISSUE CARDS */

.exec-footer { padding:10px 18px; background:rgba(0,0,0,0.2); border-top:1px solid rgba(255,255,255,0.04); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px; }

.deliverable-box { background:#111; border:1px solid #1e1e1e; border-radius:16px; padding:20px; margin-bottom:20px; }
.deliverable-title { font-size:15px; font-weight:700; color:#e8e8e8; margin-bottom:4px; }
.deliverable-desc { font-size:13px; color:#666; margin-bottom:14px; }

.walkthrough-section { margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid #1a1a1a; }

.copy-btn { margin-top:8px; font-size:11px; color:#555; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:6px; padding:4px 10px; cursor:pointer; transition:all 0.2s; }

.revenue-box { background:#111; border:1px solid #1e1e1e; border-radius:12px; padding:16px 18px; margin-bottom:24px; }

.pdf-btn { display:block; width:100%; padding:16px; border-radius:12px; background:#111; border:1px solid #2a2a2a; color:#aaa; font-size:14px; font-weight:600; text-align:center; cursor:pointer; transition:all 0.2s ease; margin-bottom:24px; text-decoration:none; }

.founder-box { background:#0d0d0d; border:1px solid #1e1e1e; border-left:3px solid #f97316; border-radius:12px; padding:18px 20px; margin-bottom:24px; display:flex; gap:16px; align-items:flex-start; }
.founder-avatar { width:44px;height:44px; background:linear-gradient(135deg,#f97316,#ea580c); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:black; flex-shrink:0; }

<body>
<div class="container">
  <div id="loadingState">Loading your AI audit...</div>
  <div id="app" style="display:none;"></div>
</div>
<script>
let email = "";
let storeDomain = "";

(async function(){
try {
const token = window.location.pathname.split("/").pop();
if (!token || token.length < 6) { document.getElementById("loadingState").innerText = "Invalid audit token."; return; }

const res = await fetch(`https://n8n-production-43ab.up.railway.app/webhook/get-audit?token=${token}`);
if (!res.ok) { document.getElementById("loadingState").innerText = "Failed to load audit."; return; }

const data = await res.json();
let r = data.report_json || {};
if (typeof r === "string") { try { r = JSON.parse(r); } catch(e) { r = {}; } }

const issues = Array.isArray(r.issues) ? r.issues : [];
const min    = Number(r.estimated_loss_min || 0);
const max    = Number(r.estimated_loss_max || 0);
const monthly = Math.round((min + max) / 2) || min || max || 0;
const daily  = Math.round(monthly / 30);
const yearly = monthly * 12;
const fmt = (n) => Number(n || 0).toLocaleString("en-US");

storeDomain = data.store_domain || data.domain || "";
const params = new URLSearchParams(window.location.search);
email = data.email || params.get("email") || "";

const aiScore = data.score || r.score || r.total_score || 0;

function getColor(s) {
  if (s >= 85) return "#1D9E75";
  if (s >= 50) return "#EF9F27";
  return "#E24B4A";
}
function getFactorColor(pct) {
  if (pct >= 70) return "#1D9E75";
  if (pct >= 40) return "#EF9F27";
  return "#E24B4A";
}

const aiColor = getColor(aiScore);

// v2.0 — 4 tiers + fallback for old DB values
function getStatusBadge(score, level) {
  const map = {
    'highly_recommendable':          { cls:"badge-high",     dot:"🟢", text:"Highly Recommendable" },
    'moderately_recommendable':      { cls:"badge-medium",   dot:"🟡", text:"Moderately Recommendable" },
    'low_recommendation_confidence': { cls:"badge-medium",   dot:"🟡", text:"Low Recommendation Confidence" },
    'ai_invisible_risk':             { cls:"badge-invisible", dot:"🔴", text:"AI Invisible Risk" },
    'ai_ready':    { cls:"badge-high",     dot:"🟢", text:"Highly Recommendable" },
    'ai_partial':  { cls:"badge-medium",   dot:"🟡", text:"Partially Visible" },
    'ai_invisible':{ cls:"badge-invisible",dot:"🔴", text:"AI Invisible Risk" },
  };
  if (level && map[level]) return map[level];
  if (score >= 85) return { cls:"badge-high",     dot:"🟢", text:"Highly Recommendable" };
  if (score >= 70) return { cls:"badge-medium",   dot:"🟡", text:"Moderately Recommendable" };
  if (score >= 50) return { cls:"badge-medium",   dot:"🟡", text:"Low Recommendation Confidence" };
  return                  { cls:"badge-invisible", dot:"🔴", text:"AI Invisible Risk" };
}

const statusBadge = getStatusBadge(aiScore, data.readiness_level || r.readiness_level || '');

// v2.0 verdict
const aiVerdictText = aiScore >= 85
  ? `<span style="color:#1D9E75;">✓ Highly Recommendable — AI agents can confidently recommend this store</span>`
  : aiScore >= 70
  ? `<span style="color:#EF9F27;">◑ Moderately Recommendable — AI recommends this store but stronger signals win more traffic</span>`
  : aiScore >= 50
  ? `<span style="color:#EF9F27;">⚠ Low Recommendation Confidence — AI sees this store but competitors with higher scores win</span>`
  : `<span style="color:#E24B4A;">✗ AI Invisible Risk — critical gaps prevent AI agents from recommending this store</span>`;

// 8 FACTORS v2.0
const schema_score    = Number(r.schema_score    || data.schema_score    || 0);
const content_score   = Number(r.content_score   || data.content_score   || 0);
const trust_score     = Number(r.trust_score     || data.trust_score     || 0);
const intent_score    = Number(r.intent_score    || data.intent_score    || 0);
const technical_score = Number(r.technical_score || data.technical_score || 0);
const price_score     = Number(r.price_score     || data.price_score     || 0);
const rec_score       = Number(r.rec_score       || data.rec_score       || 0);
const brand_score     = Number(r.brand_score     || data.brand_score     || 0);

const factorHTML = (name, score, max) => {
  const pct = max > 0 ? Math.round(score/max*100) : 0;
  const col = getFactorColor(pct);
  return `<div class="factor-row">
    <div class="factor-left">
      <div class="factor-name">${name}</div>
      <div class="factor-bar"><div class="factor-fill" style="width:${pct}%;background:${col};"></div></div>
    </div>
    <div class="factor-score" style="color:${col};">${score}/${max}</div>
  </div>`;
};

const factorsHTML = [
  factorHTML("AI Structured Signals",    schema_score,    20),
  factorHTML("Semantic Clarity",          content_score,   18),
  factorHTML("AI Trust Confidence",       trust_score,     18),
  factorHTML("User Intent Match",         intent_score,    14),
  factorHTML("AI Interpretability",       technical_score, 12),
  factorHTML("Commerce Accuracy",         price_score,     10),
  factorHTML("Recommendation Confidence", rec_score,        5),
  factorHTML("External Authority Signals",brand_score,      3),
].join("");

// AGENTIC FILES
const has_llms_txt     = r.has_llms_txt     || data.has_llms_txt     || false;
const has_llms_full    = r.has_llms_full    || data.has_llms_full    || false;
const has_agents_md    = r.has_agents_md    || data.has_agents_md    || false;
const llms_txt_quality = r.llms_txt_quality || data.llms_txt_quality || 0;

const agenticStatus = (ok) => ok
  ? `<span class="agentic-status-ok">✅ detected</span>`
  : `<span class="agentic-status-bad">❌ missing</span>`;

const qualityText = has_llms_txt
  ? (llms_txt_quality >= 2
    ? "llms.txt quality: Good — content is sufficient for AI agents."
    : llms_txt_quality === 1
    ? "llms.txt quality: Weak — file exists but content is too thin for AI agents to use effectively."
    : "llms.txt quality: Empty — file exists but has no usable content.")
  : "llms.txt is missing — Shopify Agentic Dashboard is live and this store is not configured for AI agents.";

const agenticHTML = `
  <div class="agentic-box">
    <div class="agentic-title">Shopify Agentic Files</div>
    <div class="agentic-desc">Shopify now generates these files automatically. Missing or weak files mean AI agents can't understand, browse, or purchase from this store.</div>
    <div class="agentic-row"><span class="agentic-file">llms.txt</span>${agenticStatus(has_llms_txt)}</div>
    <div class="agentic-row"><span class="agentic-file">llms-full.txt</span>${agenticStatus(has_llms_full)}</div>
    <div class="agentic-row"><span class="agentic-file">agents.md</span>${agenticStatus(has_agents_md)}</div>

async function goCheckout(btn) {
  if (!btn) return;
  const orig = btn.innerText;
  btn.innerText = "Redirecting to checkout...";
  btn.style.opacity = "0.75";
  try {
    const res = await fetch("https://n8n-production-43ab.up.railway.app/webhook/create-checkout", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ domain:storeDomain || "", email:email || "" })
    });
    const d = await res.json();
    if (!d.url) { alert("Checkout error — please try again."); btn.innerText = orig; btn.style.opacity = "1"; return; }
    window.location.href = d.url;
  } catch(err) {
    alert("Something went wrong. Please try again.");
    btn.innerText = orig; btn.style.opacity = "1";
  }
}

} catch (err) {
  console.error("FATAL:", err);
  document.getElementById("loadingState").innerText = "Something went wrong. Please refresh.";
}

function toggleExplain() {
  const box = document.getElementById("explainBox");

  if (!box) return;
  const isOpen = box.classList.contains("open");
  box.classList.toggle("open");
  toggle.innerText = isOpen ? "▸ What does this score mean?" : "▾ What does this score mean?";
}

function copyText(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText || el.textContent).then(() => {
    const orig = btn.innerText;
    btn.innerText = "✓ Copied!";
    btn.style.color = "#4ade80";
    setTimeout(() => { btn.innerText = orig; btn.style.color = ""; }, 2000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand("copy");
  });
}
