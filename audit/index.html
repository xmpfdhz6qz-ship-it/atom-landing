<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Audit – Atom Foundry</title>
<meta name="robots" content="noindex, nofollow">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto;
  background: #0A0A0A;
  color: white;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 50% -10%, rgba(249,115,22,0.12), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 620px;
  margin: 0 auto;
  padding: 28px 20px 56px;
  position: relative;
  z-index: 1;
}

/* ── HEADER BADGE ── */
.audit-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 11px;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 20px;
}
.audit-badge-dot {
  width: 6px; height: 6px;
  background: #1D9E75;
  border-radius: 50%;
  animation: blink 2s infinite;
}
@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* ── DOMAIN + HERO ── */
.domain-label { font-size: 14px; color: #aaa; margin-bottom: 8px; font-weight: 500; }

.loss-number {
  font-size: 64px;
  font-weight: 800;
  color: #E24B4A;
  line-height: 1;
  margin-bottom: 4px;
  text-shadow: 0 0 40px rgba(226,75,74,0.3);
  letter-spacing: -0.02em;
}

.loss-label { font-size: 14px; color: #aaa; margin-bottom: 16px; }

.daily-loss { font-size: 18px; color: #EF9F27; font-weight: 600; margin-bottom: 6px; }
.live-counter { font-size: 14px; color: #777; margin-bottom: 24px; min-height: 22px; }

/* ── SCORE BARS ── */
.scores-section {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 8px;
}
.score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.score-label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; min-width: 110px; }
.score-num { font-size: 22px; font-weight: 700; min-width: 65px; line-height: 1; }
.score-bar-wrap { flex: 1; height: 7px; background: #1e1e1e; border-radius: 999px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 999px; transition: width 1.2s ease; }
.score-verdict { font-size: 12px; font-weight: 600; padding-left: 124px; margin-bottom: 12px; line-height: 1.4; }

/* ── SECTION LABEL ── */
.section-label {
  font-size: 10px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #1a1a1a;
}

/* ── MAIN LEAK ── */
.main-leak-box {
  background: #111;
  border: 1px solid #1e1e1e;
  border-left: 3px solid #E24B4A;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 24px;
}
.main-leak-text { font-size: 16px; color: #e8e8e8; font-weight: 500; line-height: 1.6; }

/* ── EXECUTION CARDS ── */
.execution-cards { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }

.exec-card {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 16px;
  overflow: hidden;
  transition: all 0.25s ease;
}

.exec-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.6); }

.exec-card-header {
  padding: 16px 18px 14px;
  border-bottom: 1px solid #1a1a1a;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.exec-num {
  width: 32px; height: 32px;
  border-radius: 10px;
  background: #1a1a1a;
  font-size: 13px;
  font-weight: 700;
  color: #f97316;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}

.exec-card:nth-child(1) .exec-num { background: rgba(226,75,74,0.12); color: #E24B4A; }
.exec-card:nth-child(2) .exec-num { background: rgba(239,159,39,0.12); color: #EF9F27; }
.exec-card:nth-child(3) .exec-num { background: rgba(249,115,22,0.12); color: #f97316; }
.exec-card:nth-child(4) .exec-num { background: rgba(29,158,117,0.12); color: #1D9E75; }

.exec-card-title { font-size: 15px; font-weight: 600; color: #e8e8e8; line-height: 1.4; margin-bottom: 4px; }
.exec-card-impact { font-size: 13px; font-weight: 700; }
.exec-card:nth-child(1) .exec-card-impact { color: #E24B4A; }
.exec-card:nth-child(2) .exec-card-impact { color: #EF9F27; }
.exec-card:nth-child(3) .exec-card-impact { color: #f97316; }
.exec-card:nth-child(4) .exec-card-impact { color: #1D9E75; }

.exec-card-body { padding: 14px 18px; }

.exec-reason {
  font-size: 13px;
  color: #999;
  line-height: 1.6;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px solid #1a1a1a;
}

.exec-fix-label {
  font-size: 10px;
  color: #1D9E75;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 700;
  margin-bottom: 8px;
}

.exec-fix-text {
  font-size: 14px;
  color: #4ade80;
  line-height: 1.6;
  margin-bottom: 12px;
}

.exec-steps { list-style: none; padding: 0; margin: 0 0 12px 0; }
.exec-step {
  font-size: 13px;
  color: #888;
  padding: 5px 0 5px 20px;
  position: relative;
  line-height: 1.5;
  border-bottom: 1px solid #141414;
}
.exec-step:last-child { border-bottom: none; }
.exec-step::before {
  content: counter(step-counter);
  counter-increment: step-counter;
  position: absolute;
  left: 0;
  top: 5px;
  font-size: 10px;
  font-weight: 700;
  color: #444;
  width: 16px;
  height: 16px;
  background: #1a1a1a;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.exec-steps { counter-reset: step-counter; }

.exec-footer {
  padding: 10px 18px;
  background: #0d0d0d;
  border-top: 1px solid #1a1a1a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.exec-timeline { font-size: 11px; color: #555; font-weight: 500; }
.exec-priority { font-size: 11px; font-weight: 700; }
.priority-critical { color: #E24B4A; }
.priority-high { color: #EF9F27; }
.priority-medium { color: #f97316; }
.priority-low { color: #1D9E75; }

/* ── MONITORING UPSELL ── */
.monitoring-box {
  background: #0d1a0d;
  border: 1px solid #1a2e1a;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
}
.monitoring-title { font-size: 14px; font-weight: 700; color: #4ade80; margin-bottom: 6px; }
.monitoring-desc { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 14px; }
.monitoring-features { list-style: none; padding: 0; margin: 0 0 16px 0; }
.monitoring-feature { font-size: 13px; color: #666; padding: 4px 0; }
.monitoring-feature::before { content: "✓ "; color: #1D9E75; font-weight: 700; }

.monitoring-cta {
  display: block;
  width: 100%;
  padding: 16px;
  border-radius: 12px;
  background: #0a1a0a;
  border: 1px solid #1a3a1a;
  color: #4ade80;
  font-size: 15px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
}
.monitoring-cta:hover { background: #0f2a0f; transform: translateY(-1px); }

/* ── PDF DOWNLOAD ── */
.pdf-btn {
  display: block;
  width: 100%;
  padding: 14px;
  border-radius: 12px;
  background: #111;
  border: 1px solid #222;
  color: #666;
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-bottom: 24px;
  text-decoration: none;
}
.pdf-btn:hover { color: #888; border-color: #333; }

/* ── FOOTER ── */
.footer { padding-top: 20px; border-top: 1px solid #1e1e1e; text-align: center; }
.footer-scan-line { font-size: 12px; color: #555; margin-bottom: 10px; line-height: 1.6; }
.footer-tagline { font-size: 15px; font-weight: 700; color: #f97316; letter-spacing: 0.04em; }

/* ── LOADING ── */
#loadingState { text-align: center; padding: 80px 20px; font-size: 15px; color: #555; }

/* ── PRINT ── */
@media print {
  body { background: white; color: black; }
  body::before { display: none; }
  .monitoring-box, .pdf-btn, .monitoring-cta { display: none; }
  .exec-card { border: 1px solid #ddd; page-break-inside: avoid; }
  .footer-tagline { color: #f97316; }
}

/* ── MOBILE ── */
@media (max-width: 480px) {
  .loss-number { font-size: 52px; }
  .daily-loss { font-size: 17px; }
  .score-label { min-width: 90px; font-size: 11px; }
  .score-num { font-size: 20px; min-width: 55px; }
  .score-verdict { padding-left: 100px; }
  .exec-card-title { font-size: 14px; }
  .exec-fix-text { font-size: 13px; }
}
</style>
</head>

<body>
<div class="container">
  <div id="loadingState">Loading your audit...</div>
  <div id="app" style="display:none;"></div>
</div>

<script>
let email = "";
let storeDomain = "";

function bindCTA() {
  const btn1 = document.getElementById("monitoring-btn");
  const btn2 = document.getElementById("monitoring-btn-top");

  [btn1, btn2].forEach(btn => {
    if (!btn) return;

    btn.addEventListener("click", async (e) => {
      e.preventDefault();

      if (!email) {
        email = localStorage.getItem("email");
      }

      if (!email) {
        alert("Missing email");
        return;
      }

      if (!storeDomain) {
        alert("Missing domain");
        return;
      }

      try {
        const res = await fetch(
          "https://n8n-production-43ab.up.railway.app/webhook/create-monitoring" +
          "?domain=" + encodeURIComponent(storeDomain) +
          "&email=" + encodeURIComponent(email)
        );

        if (!res.ok) {
          console.error("Webhook failed", res.status);
          alert("Something broke");
          return;
        }

        const result = await res.json();

        const fallback = "https://buy.stripe.com/8x2aEQ4tt4xW6e7egk1RC00";

        if (!result.url) {
          window.location.href = fallback;
          return;
        }

        window.location.href = result.url;

      } catch (e) {
        alert("Connection error");
      }
    });
  });
}

(async function(){

try {

const token = window.location.pathname.split("/").pop();

if (!token || token.length < 6) {
  console.error("Invalid token");
  document.getElementById("loadingState").innerText = "Invalid audit token.";
  return;
}

const res = await fetch(`https://n8n-production-43ab.up.railway.app/webhook/get-audit?token=${token}`);

if (!res.ok) {
  console.error("API error:", res.status);
  document.getElementById("loadingState").innerText = "Failed to load audit.";
  return;
}

const data = await res.json();

let r = data.report_json || {};

if (typeof r === "string") {
  try { r = JSON.parse(r); } catch(e) { r = {}; }
}

const issues = Array.isArray(r.issues) ? r.issues : [];

const min = Number(r.estimated_loss_min || 0);
const max = Number(r.estimated_loss_max || 0);
const monthly = Math.round((min + max) / 2) || Math.round((Number(r.revenue_calculation?.monthly_loss_value || 0)));
const daily = Math.round(monthly / 30);
const yearly = monthly * 12;

const fmt = (n) => Number(n || 0).toLocaleString("en-US");

storeDomain = data.store_domain || data.domain || "";

const params = new URLSearchParams(window.location.search);
email = data.email || params.get("email") || "";
if (email) localStorage.setItem("email", email);

const croScore = data.cro_score || data.score || r.score || 65;
const arsScore = data.ars_score || r.ars_score || Math.round(croScore * 0.65);

const croColor = croScore >= 70 ? "#1D9E75" : croScore >= 50 ? "#EF9F27" : "#E24B4A";
const arsColor = arsScore >= 70 ? "#1D9E75" : arsScore >= 40 ? "#EF9F27" : "#E24B4A";

const croVerdictText = croScore >= 75
  ? `<span style="color:#1D9E75;">✓ Good conversion health — room to optimize</span>`
  : croScore >= 50
  ? `<span style="color:#EF9F27;">⚠ Conversion issues are costing you revenue</span>`
  : `<span style="color:#E24B4A;">✗ Critical conversion problems — buyers are leaving</span>`;

const arsVerdictText = arsScore >= 70
  ? `<span style="color:#1D9E75;">✓ AI agents can find and recommend your store</span>`
  : arsScore >= 40
  ? `<span style="color:#EF9F27;">⚠ AI agents may skip your store in recommendations</span>`
  : `<span style="color:#E24B4A;">✗ AI agents cannot find or recommend your store</span>`;

const priorityLabels = ["critical", "high", "medium", "low"];
const priorityColors = ["priority-critical", "priority-high", "priority-medium", "priority-low"];
const priorityTexts = ["Critical priority", "High priority", "Medium priority", "Low priority"];

const execCardsHTML = issues.map((issue, i) => {
  const impact = Number(issue.impact_value || 0);
  const steps = Array.isArray(issue.fix_steps) && issue.fix_steps.length > 0
    ? issue.fix_steps
    : [
        "Identify the exact section where this appears",
        "Adjust visual hierarchy and element positioning",
        "Remove competing elements near the decision point",
        "Test conversion before and after the change"
      ];

  const stepsHTML = steps.slice(0, 4).map(s =>
    `<li class="exec-step">${String(s).replace(/</g, "&lt;")}</li>`
  ).join("");

  const timeline = issue.recovery_time || "30–60 minutes";
  const priorityClass = priorityColors[i] || "priority-low";
  const priorityText = priorityTexts[i] || "Low priority";

  return `
  <div class="exec-card">
    <div class="exec-card-header">
      <div class="exec-num">${i + 1}</div>
      <div style="flex:1;">
        <div class="exec-card-title">${String(issue.title || "Conversion issue").replace(/</g, "&lt;")}</div>
        <div class="exec-card-impact">${impact > 0 ? "~$" + fmt(impact) + "/month impact" : "Revenue impact detected"}</div>
      </div>
    </div>
    <div class="exec-card-body">
      <div class="exec-reason">${String(issue.reason || issue.why_it_matters || "This issue slows user decision-making.").replace(/</g, "&lt;")}</div>
      <div class="exec-fix-label">✓ Exact fix</div>
      <div class="exec-fix-text">${String(issue.fix || "").replace(/</g, "&lt;")}</div>
      <ul class="exec-steps">${stepsHTML}</ul>
    </div>
    <div class="exec-footer">
      <div class="exec-timeline">⏱ ${timeline} to implement</div>
      <div class="exec-priority ${priorityClass}">${priorityText}</div>
    </div>
  </div>
  `;
}).join("");

const mainLeak = r.main_leak || r.primary_failure || "Decision path is not clearly guiding users to purchase.";

document.getElementById("loadingState").style.display = "none";
const app = document.getElementById("app");
app.style.display = "block";

app.innerHTML = `

  <div class="audit-badge">
    <span class="audit-badge-dot"></span>
    Full Revenue Audit · atomfoundry.dev
  </div>

  <div class="domain-label">${storeDomain}</div>
  <div class="loss-number">$${fmt(monthly)}/month</div>
  <div class="loss-label">estimated revenue loss · full audit complete</div>

  <div class="daily-loss">⚡ That's $${fmt(daily)} every single day.</div>
  <div class="live-counter" id="liveCounter"></div>

  <div class="scores-section">
    <div class="score-row">
      <div class="score-label">CRO Score</div>
      <div class="score-num" style="color:${croColor};">${croScore}<span style="font-size:13px;color:#555;">/100</span></div>
      <div class="score-bar-wrap">
        <div class="score-bar-fill" id="croBar" style="width:0%;background:${croColor};"></div>
      </div>
    </div>
    <div class="score-verdict">${croVerdictText}</div>

    <div class="score-row">
      <div class="score-label">AI Readiness</div>
      <div class="score-num" style="color:${arsColor};">${arsScore}<span style="font-size:13px;color:#555;">/100</span></div>
      <div class="score-bar-wrap">
        <div class="score-bar-fill" id="arsBar" style="width:0%;background:${arsColor};"></div>
      </div>
    </div>
    <div class="score-verdict">${arsVerdictText}</div>
  </div>

  <div style="margin-bottom:20px;">
    <div class="section-label">Primary leak identified</div>
    <div class="main-leak-box">
      <div class="main-leak-text">${String(mainLeak).replace(/</g, "&lt;")}</div>
    </div>
  </div>

  <div class="section-label">4 Execution fixes</div>
  <div class="execution-cards">${execCardsHTML}</div>

  <div class="section-label">Revenue summary</div>
  <div style="background:#111;border:1px solid #1e1e1e;border-radius:12px;padding:16px 18px;margin-bottom:24px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1a1a1a;">
      <span style="font-size:13px;color:#888;">Monthly loss</span>
      <span style="font-size:16px;font-weight:700;color:#E24B4A;">$${fmt(monthly)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #1a1a1a;">
      <span style="font-size:13px;color:#888;">Daily loss</span>
      <span style="font-size:16px;font-weight:700;color:#EF9F27;">$${fmt(daily)}</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <span style="font-size:13px;color:#888;">Yearly projection</span>
      <span style="font-size:16px;font-weight:700;color:#E24B4A;">$${fmt(yearly)}</span>
    </div>
  </div>

  <a href="#" class="pdf-btn" onclick="window.print(); return false;">
    ↓ Download Full Execution Plan (PDF)
  </a>

  <div class="section-label">Keep your store optimized</div>
  <div class="monitoring-box">
    <div class="monitoring-title">⚡ Add Revenue Monitoring — $79/month</div>
    <div class="monitoring-desc">
      Conversion leaks evolve. New issues appear as your store grows, competitors improve, and user behavior shifts.
      Monitoring catches them before they cost you money.
    </div>
    <ul class="monitoring-features">
      <li class="monitoring-feature">Weekly automated store scan</li>
      <li class="monitoring-feature">Instant alert when new leak is detected</li>
      <li class="monitoring-feature">Revenue impact tracked over time</li>
      <li class="monitoring-feature">Monthly benchmark vs top DTC stores</li>
    </ul>
    <div id="monitoring-btn" class="monitoring-cta">
      Add Monitoring — $79/month →
    </div>
    <div style="font-size:11px;color:#444;text-align:center;margin-top:8px;">
      Cancel anytime &nbsp;·&nbsp; No contracts &nbsp;·&nbsp; Instant setup
    </div>
  </div>

  <div class="footer">
    <div class="footer-scan-line">
      Full revenue audit · atomfoundry.dev &nbsp;·&nbsp;
      <a href="#" onclick="openBillingPortal();return false;" style="color:#444;text-decoration:none;">Manage subscription</a>
    </div>
    <div class="footer-tagline">Find → Prove → Fix → Protect</div>
  </div>
`;

setTimeout(() => {
  const croBar = document.getElementById("croBar");
  const arsBar = document.getElementById("arsBar");
  if (croBar) croBar.style.width = croScore + "%";
  if (arsBar) arsBar.style.width = arsScore + "%";
}, 300);

const hourly = Math.round(daily / 24);
let seconds = 0;
const counter = document.getElementById("liveCounter");
setInterval(() => {
  seconds++;
  const lost = Math.round((hourly / 3600) * seconds);
  if (counter) counter.innerText = `$${lost.toLocaleString()} lost while you are reading this`;
}, 1000);

bindCTA();

} catch (err) {
  console.error("FATAL:", err);
  document.getElementById("loadingState").innerText = "Something went wrong. Please refresh.";
}

})();

async function openBillingPortal() {
  const params = new URLSearchParams(window.location.search);
  const emailParam = params.get("email") || localStorage.getItem("email");

  if (!emailParam) {
    alert("Missing email");
    return;
  }

  try {
    const res = await fetch(
      "https://n8n-production-43ab.up.railway.app/webhook/create-portal?email=" + encodeURIComponent(emailParam)
    );

    const result = await res.json();

    if (result.error === "no_subscription") {
      window.location.href = "/#pricing";
      return;
    }

    window.location.href = result.url;

  } catch (err) {
    alert("Connection error");
  }
}
</script>

</body>
</html>
