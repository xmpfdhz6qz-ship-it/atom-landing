<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenue Audit – Atom Foundry</title>
<meta name="robots" content="noindex, nofollow">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto;
  background: #0A0A0A;
  color: white;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 50% -10%, rgba(249,115,22,0.12), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 620px;
  margin: 0 auto;
  padding: 28px 20px 56px;
  position: relative;
  z-index: 1;
}

.audit-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 11px;
  color: #aaa;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 20px;
}
.audit-badge-dot {
  width: 6px; height: 6px;
  background: #1D9E75;
  border-radius: 50%;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

.domain-label { font-size: 14px; color: #aaa; margin-bottom: 8px; font-weight: 500; }
.loss-number {
  font-size: 64px; font-weight: 800; color: #E24B4A;
  line-height: 1; margin-bottom: 4px;
  text-shadow: 0 0 40px rgba(226,75,74,0.3);
  letter-spacing: -0.02em;
}
.loss-label { font-size: 14px; color: #aaa; margin-bottom: 16px; }
.daily-loss { font-size: 18px; color: #EF9F27; font-weight: 600; margin-bottom: 6px; }
.live-counter { font-size: 14px; color: #888; margin-bottom: 24px; min-height: 22px; }

.scores-section {
  background: #111; border: 1px solid #1e1e1e;
  border-radius: 16px; padding: 18px 20px; margin-bottom: 8px;
}
.score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.score-label {
  font-size: 12px; color: #aaa; text-transform: uppercase;
  letter-spacing: 0.06em; font-weight: 600; min-width: 110px;
}
.score-num { font-size: 22px; font-weight: 700; min-width: 65px; line-height: 1; }
.score-bar-wrap { flex: 1; height: 7px; background: #1e1e1e; border-radius: 999px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 999px; transition: width 1.2s ease; }
.score-verdict { font-size: 12px; font-weight: 600; padding-left: 124px; margin-bottom: 12px; line-height: 1.4; }

.ars-detail-link {
  font-size: 13px; color: #f97316; cursor: pointer;
  padding-left: 124px; margin-bottom: 14px; display: block;
  text-decoration: none; letter-spacing: 0.01em; font-weight: 500;
}
.ars-detail-link:hover { color: #fb923c; }

.ars-popup {
  display: none; background: #0d0d0d; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 18px 20px; margin-bottom: 12px;
}
.ars-popup.open { display: block; }
.ars-popup-title { font-size: 14px; font-weight: 700; color: #ddd; margin-bottom: 8px; }
.ars-popup-desc { font-size: 13px; color: #999; line-height: 1.6; margin-bottom: 16px; }
.ars-factor {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid #141414;
}
.ars-factor:last-of-type { border-bottom: none; }
.ars-factor-left { flex: 1; }
.ars-factor-name { font-size: 13px; color: #aaa; margin-bottom: 4px; }
.ars-factor-bar { height: 4px; background: #1a1a1a; border-radius: 999px; overflow: hidden; }
.ars-factor-fill { height: 100%; background: #f97316; border-radius: 999px; }
.ars-factor-weight { font-size: 13px; font-weight: 700; color: #f97316; min-width: 36px; text-align: right; }
.ars-popup-footer { font-size: 12px; color: #666; margin-top: 12px; line-height: 1.6; }

.explain-toggle {
  font-size: 13px; color: #f97316; cursor: pointer;
  text-align: center; padding: 10px; margin-bottom: 16px;
  user-select: none; letter-spacing: 0.02em;
}
.explain-toggle:hover { color: #fb923c; }
.explain-box {
  display: none; background: #0d0d0d; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 16px 18px; margin-bottom: 20px;
  font-size: 13px; color: #aaa; line-height: 1.8;
}
.explain-box.open { display: block; }
.explain-title { font-size: 14px; font-weight: 700; color: #ddd; margin-bottom: 12px; }
.explain-item { margin-bottom: 10px; padding-left: 4px; }
.explain-item:last-child { margin-bottom: 0; }
.explain-highlight { color: #f97316; font-weight: 600; }

.section-label {
  font-size: 10px; color: #777; text-transform: uppercase;
  letter-spacing: 0.1em; font-weight: 700; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.section-label::after { content: ""; flex: 1; height: 1px; background: #1a1a1a; }

.main-leak-box {
  background: #111; border: 1px solid #1e1e1e;
  border-left: 3px solid #E24B4A; border-radius: 12px;
  padding: 16px 18px; margin-bottom: 24px;
}
.main-leak-text { font-size: 16px; color: #e8e8e8; font-weight: 500; line-height: 1.6; }

.execution-cards { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }

.exec-card {
  border-radius: 16px; overflow: hidden;
  transition: all 0.25s ease; border: 1px solid;
}
.exec-card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.6); }

.exec-card-1 { background: rgba(226,75,74,0.06); border-color: rgba(226,75,74,0.25); }
.exec-card-2 { background: rgba(239,159,39,0.06); border-color: rgba(239,159,39,0.25); }
.exec-card-3 { background: rgba(249,115,22,0.06); border-color: rgba(249,115,22,0.25); }
.exec-card-4 { background: rgba(29,158,117,0.06); border-color: rgba(29,158,117,0.25); }

.exec-card-header {
  padding: 16px 18px 14px; border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: flex-start; gap: 14px;
}
.exec-num {
  width: 32px; height: 32px; border-radius: 10px;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
}
.exec-card-1 .exec-num { background: rgba(226,75,74,0.15); color: #E24B4A; }
.exec-card-2 .exec-num { background: rgba(239,159,39,0.15); color: #EF9F27; }
.exec-card-3 .exec-num { background: rgba(249,115,22,0.15); color: #f97316; }
.exec-card-4 .exec-num { background: rgba(29,158,117,0.15); color: #1D9E75; }

.exec-card-title { font-size: 15px; font-weight: 600; color: #e8e8e8; line-height: 1.4; margin-bottom: 4px; }
.exec-card-1 .exec-card-impact { color: #E24B4A; font-size: 13px; font-weight: 700; }
.exec-card-2 .exec-card-impact { color: #EF9F27; font-size: 13px; font-weight: 700; }
.exec-card-3 .exec-card-impact { color: #f97316; font-size: 13px; font-weight: 700; }
.exec-card-4 .exec-card-impact { color: #1D9E75; font-size: 13px; font-weight: 700; }

.exec-card-body { padding: 14px 18px; }
.exec-reason {
  font-size: 14px; color: #aaa; line-height: 1.6;
  margin-bottom: 12px; padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.exec-fix-label {
  font-size: 10px; color: #1D9E75; text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 700; margin-bottom: 8px;
}
.exec-fix-text { font-size: 14px; color: #4ade80; line-height: 1.6; margin-bottom: 12px; }

.exec-steps { list-style: none; padding: 0; margin: 0 0 12px 0; counter-reset: step-counter; }
.exec-step {
  font-size: 13px; color: #999; padding: 6px 0 6px 24px;
  position: relative; line-height: 1.5;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.exec-step:last-child { border-bottom: none; }
.exec-step::before {
  content: counter(step-counter); counter-increment: step-counter;
  position: absolute; left: 0; top: 7px;
  font-size: 10px; font-weight: 700; color: #555;
  width: 16px; height: 16px; background: #1a1a1a; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}

/* ── EXEC FOOTER — rozšířen o Time-to-Money ── */
.exec-footer {
  padding: 10px 18px; background: rgba(0,0,0,0.2);
  border-top: 1px solid rgba(255,255,255,0.04);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 4px;
}
.exec-timeline { font-size: 11px; color: #666; font-weight: 500; }
.exec-impact-time {
  font-size: 11px; color: #1D9E75; font-weight: 600;
}
.priority-critical { font-size: 11px; font-weight: 700; color: #E24B4A; }
.priority-high     { font-size: 11px; font-weight: 700; color: #EF9F27; }
.priority-medium   { font-size: 11px; font-weight: 700; color: #f97316; }
.priority-low      { font-size: 11px; font-weight: 700; color: #1D9E75; }

.revenue-box {
  background: #111; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 16px 18px; margin-bottom: 24px;
}
.revenue-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid #1a1a1a;
}
.revenue-row:last-child { border-bottom: none; padding-bottom: 0; }
.revenue-row-label { font-size: 13px; color: #888; }
.revenue-row-value { font-size: 16px; font-weight: 700; }

.pdf-btn {
  display: block; width: 100%; padding: 16px;
  border-radius: 12px; background: #111; border: 1px solid #2a2a2a;
  color: #aaa; font-size: 14px; font-weight: 600; text-align: center;
  cursor: pointer; transition: all 0.2s ease; margin-bottom: 24px; text-decoration: none;
}
.pdf-btn:hover { color: #ccc; border-color: #444; background: #161616; }

/* ── FOUNDER BOX ── */
.founder-box {
  background: #0d0d0d;
  border: 1px solid #1e1e1e;
  border-left: 3px solid #f97316;
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 24px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.founder-avatar {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: black;
  flex-shrink: 0;
}
.founder-text { flex: 1; }
.founder-name { font-size: 13px; font-weight: 700; color: #e8e8e8; margin-bottom: 4px; }
.founder-sub { font-size: 11px; color: #666; margin-bottom: 8px; }
.founder-quote {
  font-size: 13px; color: #aaa; line-height: 1.7;
  font-style: italic;
}

.dfy-box {
  background: #0f0f0f; border: 1px solid #f97316;
  border-radius: 16px; padding: 20px; margin-bottom: 24px;
  position: relative; overflow: hidden;
}
.dfy-box::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(249,115,22,0.06), transparent 60%);
  pointer-events: none;
}
.dfy-tag {
  display: inline-block; background: rgba(249,115,22,0.15);
  color: #f97316; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.1em;
  padding: 3px 10px; border-radius: 999px; margin-bottom: 10px;
}
.dfy-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
.dfy-desc { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 14px; }
.dfy-features { list-style: none; padding: 0; margin: 0 0 16px 0; }
.dfy-feature { font-size: 13px; color: #888; padding: 4px 0; }
.dfy-feature::before { content: "✓ "; color: #f97316; font-weight: 700; }
.dfy-price { font-size: 13px; color: #666; margin-bottom: 14px; }
.dfy-price strong { color: #f97316; font-size: 15px; }
.dfy-cta {
  display: block; width: 100%; padding: 18px;
  border-radius: 14px; border: 2px solid #dc2626;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: black; font-weight: 900; font-size: 17px;
  text-align: center; cursor: pointer; text-decoration: none;
  transition: all 0.25s ease; box-shadow: 0 10px 25px rgba(249,115,22,0.35);
}
.dfy-cta:hover { transform: translateY(-2px); box-shadow: 0 16px 35px rgba(249,115,22,0.6); }

/* ── CTA TLAČÍTKO ── */
.cta-btn {
  display: block; width: 100%; padding: 20px;
  border-radius: 14px; border: 2px solid #dc2626;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: black; font-weight: 900; font-size: 17px;
  text-align: center; cursor: pointer; text-decoration: none;
  box-shadow: 0 12px 30px rgba(249,115,22,0.4);
  transition: all 0.25s ease;
  animation: ctaPulse 2.5s infinite;
  margin-bottom: 10px;
}
.cta-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(249,115,22,0.65); }
.cta-btn:active { transform: scale(0.97); }
@keyframes ctaPulse {
  0%   { box-shadow: 0 0 0 rgba(249,115,22,0.4); }
  50%  { box-shadow: 0 0 30px rgba(249,115,22,0.6); }
  100% { box-shadow: 0 0 0 rgba(249,115,22,0.4); }
}
.cta-sub {
  font-size: 13px; color: #888;
  text-align: center; line-height: 1.8; margin-bottom: 6px;
}
.cta-sub-green { font-size: 13px; color: #1D9E75; text-align: center; margin-bottom: 24px; }

.monitoring-box {
  background: #0d1a0d; border: 1px solid #1a2e1a;
  border-radius: 16px; padding: 20px; margin-bottom: 24px;
}
.monitoring-title { font-size: 14px; font-weight: 700; color: #4ade80; margin-bottom: 6px; }
.monitoring-desc { font-size: 13px; color: #888; line-height: 1.6; margin-bottom: 14px; }
.monitoring-features { list-style: none; padding: 0; margin: 0 0 16px 0; }
.monitoring-feature { font-size: 13px; color: #777; padding: 4px 0; }
.monitoring-feature::before { content: "✓ "; color: #1D9E75; font-weight: 700; }
.monitoring-cta {
  display: block; width: 100%; padding: 18px;
  border-radius: 14px; border: 2px solid #dc2626;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: black; font-weight: 900; font-size: 17px;
  text-align: center; cursor: pointer; text-decoration: none;
  box-shadow: 0 10px 25px rgba(249,115,22,0.35);
  transition: all 0.25s ease; margin-bottom: 8px;
}
.monitoring-cta:hover { transform: translateY(-2px); box-shadow: 0 16px 35px rgba(249,115,22,0.6); }
.monitoring-micro { font-size: 12px; color: #555; text-align: center; }

.footer { padding-top: 20px; border-top: 1px solid #1e1e1e; text-align: center; }
.footer-scan-line { font-size: 13px; color: #777; margin-bottom: 10px; line-height: 1.8; white-space: nowrap; }
.footer-tagline { font-size: 16px; font-weight: 700; color: #f97316; letter-spacing: 0.04em; }

#loadingState { text-align: center; padding: 80px 20px; font-size: 15px; color: #555; }

@media print {
  body { background: white; color: black; }
  body::before { display: none; }
  .monitoring-box, .dfy-box, .pdf-btn, .live-counter, .founder-box { display: none; }
  .exec-card-1 { background: #fff5f5 !important; border-color: #fca5a5 !important; }
  .exec-card-2 { background: #fffbeb !important; border-color: #fcd34d !important; }
  .exec-card-3 { background: #fff7ed !important; border-color: #fdba74 !important; }
  .exec-card-4 { background: #f0fdf4 !important; border-color: #86efac !important; }
  .exec-card { page-break-inside: avoid; }
  .exec-card-title, .exec-reason, .exec-step { color: #111 !important; }
  .footer-tagline { color: #f97316 !important; }
}

@media (max-width: 480px) {
  .loss-number { font-size: 52px; }
  .daily-loss { font-size: 17px; }
  .score-label { min-width: 90px; font-size: 11px; }
  .score-num { font-size: 20px; min-width: 55px; }
  .score-verdict { padding-left: 100px; }
  .ars-detail-link { padding-left: 100px; }
  .exec-card-title { font-size: 14px; }
  .exec-fix-text { font-size: 13px; }
  .exec-reason { font-size: 13px; }
  .footer-scan-line { white-space: normal; font-size: 12px; }
  .footer-tagline { font-size: 14px; }
  .cta-btn { font-size: 15px; padding: 18px; }
}
</style>
</head>

<body>
<div class="container">
  <div id="loadingState">Loading your audit...</div>
  <div id="app" style="display:none;"></div>
</div>

<script>
let email = "";
let storeDomain = "";

function bindCTA() {
  const btn = document.getElementById("monitoring-btn");
  if (!btn) return;
  btn.addEventListener("click", async (e) => {
    e.preventDefault();
    if (!email) email = localStorage.getItem("email");
    if (!email) { alert("Missing email"); return; }
    if (!storeDomain) { alert("Missing domain"); return; }
    try {
      const res = await fetch(
        "https://n8n-production-43ab.up.railway.app/webhook/create-monitoring" +
        "?domain=" + encodeURIComponent(storeDomain) +
        "&email=" + encodeURIComponent(email)
      );
      if (!res.ok) { alert("Something broke"); return; }
      const result = await res.json();
      const fallback = "https://buy.stripe.com/8x2aEQ4tt4xW6e7egk1RC00";
      window.location.href = result.url || fallback;
    } catch (e) { alert("Connection error"); }
  });
}

(async function(){
try {

const token = window.location.pathname.split("/").pop();
if (!token || token.length < 6) {
  document.getElementById("loadingState").innerText = "Invalid audit token.";
  return;
}

const res = await fetch(`https://n8n-production-43ab.up.railway.app/webhook/get-audit?token=${token}`);
if (!res.ok) {
  document.getElementById("loadingState").innerText = "Failed to load audit.";
  return;
}

const data = await res.json();
let r = data.report_json || {};
if (typeof r === "string") { try { r = JSON.parse(r); } catch(e) { r = {}; } }

const issues  = Array.isArray(r.issues) ? r.issues : [];
const min     = Number(r.estimated_loss_min || 0);
const max     = Number(r.estimated_loss_max || 0);
const monthly = Math.round((min + max) / 2) || Math.round(Number(r.revenue_calculation?.monthly_loss_value || 0));
const daily   = Math.round(monthly / 30);
const yearly  = monthly * 12;
const fmt = (n) => Number(n || 0).toLocaleString("en-US");

storeDomain = data.store_domain || data.domain || "";
const params = new URLSearchParams(window.location.search);
email = data.email || params.get("email") || "";
if (email) localStorage.setItem("email", email);

const croScore = data.cro_score || data.score || r.score || 65;
const arsScore = data.ars_score || r.ars_score || Math.round(croScore * 0.65);

const getCroColor = (s) => s >= 90 ? "#1D9E75" : s >= 60 ? "#EF9F27" : "#E24B4A";
const getArsColor = (s) => s >= 90 ? "#1D9E75" : s >= 50 ? "#EF9F27" : "#E24B4A";
const croColor = getCroColor(croScore);
const arsColor = getArsColor(arsScore);

const croVerdictText = croScore >= 90
  ? `<span style="color:#1D9E75;">✓ Strong conversion health — maintain and monitor</span>`
  : croScore >= 60
  ? `<span style="color:#EF9F27;">⚠ You're leaving money on the table — competitors scoring 90+ are winning your customers</span>`
  : `<span style="color:#E24B4A;">✗ Critical conversion problems — buyers are leaving before purchasing</span>`;

const arsVerdictText = arsScore >= 90
  ? `<span style="color:#1D9E75;">✓ Fully visible to AI agents — strong discovery position</span>`
  : arsScore >= 50
  ? `<span style="color:#EF9F27;">⚠ You're partially visible to AI — competitors may outrank you in AI search</span>`
  : `<span style="color:#E24B4A;">✗ AI agents cannot find or recommend your store</span>`;

const cardClasses     = ["exec-card-1","exec-card-2","exec-card-3","exec-card-4"];
const priorityTexts   = ["Critical priority","High priority","Medium priority","Low priority"];
const priorityClasses = ["priority-critical","priority-high","priority-medium","priority-low"];

const execCardsHTML = issues.map((issue, i) => {
  const impact = Number(issue.impact_value || 0);
  const steps  = Array.isArray(issue.fix_steps) && issue.fix_steps.length > 0
    ? issue.fix_steps
    : [
        "Identify the exact section where this appears",
        "Adjust visual hierarchy and element positioning",
        "Remove competing elements near the decision point",
        "Validate with A/B test or session recordings"
      ];
  const stepsHTML = steps.slice(0,4).map(s =>
    `<li class="exec-step">${String(s).replace(/</g,"&lt;")}</li>`
  ).join("");
  const timeline = issue.recovery_time || "1–3 days";

  return `
  <div class="exec-card ${cardClasses[i] || 'exec-card-4'}">
    <div class="exec-card-header">
      <div class="exec-num">${i+1}</div>
      <div style="flex:1;">
        <div class="exec-card-title">${String(issue.title||"Conversion issue").replace(/</g,"&lt;")}</div>
        <div class="exec-card-impact">${impact > 0 ? "~$"+fmt(impact)+"/month impact" : "Revenue impact detected"}</div>
      </div>
    </div>
    <div class="exec-card-body">
      <div class="exec-reason">${String(issue.reason||issue.why_it_matters||"This issue slows user decision-making.").replace(/</g,"&lt;")}</div>
      <div class="exec-fix-label">✓ Exact fix</div>
      <div class="exec-fix-text">${String(issue.fix||"").replace(/</g,"&lt;")}</div>
