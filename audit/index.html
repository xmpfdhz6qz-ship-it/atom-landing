<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
  background:#0A0A0A;
  color:#fff;
  padding:16px;
}
.container {max-width:720px;margin:auto;}
.card {
  background:#111;
  border:1px solid #222;
  border-radius:20px;
  padding:24px;
  margin-top:16px;
}
.big {font-size:42px;font-weight:900;color:#ef4444;}
.score {font-size:56px;font-weight:900;color:#22c55e;}
.sub {color:#aaa;margin-top:6px;}
.cta {
  display:block;
  padding:20px;
  background:#f97316;
  border:2px solid #dc2626;
  text-align:center;
  border-radius:16px;
  font-weight:900;
  margin-top:16px;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
<div id="domain"></div>
<div class="big" id="monthly"></div>
<div id="daily"></div>
<div class="score" id="score"></div>
<div id="label"></div>
</div>

<div class="card" id="benchmark"></div>

<div class="card">
<b>Primary Failure</b>
<div id="primary"></div>
</div>

<div class="card">
<b>Where Money Is Lost</b>
<div id="dist"></div>
</div>

<div class="card">
<b>Conversion Leaks</b>
<div id="issues"></div>
</div>

<div class="card">
<b>Execution Plan</b>
<div id="steps"></div>
</div>

<div class="card">
<a class="cta" id="cta"></a>
</div>

</div>

<script>
(async function(){

const token = location.pathname.split("/").pop();
const res = await fetch(`https://n8n-production-d989b.up.railway.app/webhook/get-audit?token=${token}`);
const data = await res.json();

const r = data.report_json || data;
const calc = r.revenue_calculation;

const monthly = calc.monthly_loss_value;
const daily = calc.daily_loss_value;

document.getElementById("domain").innerText = data.domain;
document.getElementById("monthly").innerText = `$${monthly.toLocaleString()}/month`;
document.getElementById("daily").innerText = `≈ $${daily}/day`;

document.getElementById("score").innerText = r.score;
document.getElementById("label").innerText = "Revenue leak detected";

document.getElementById("benchmark").innerHTML = `
Compared to similar stores:
<br>Your score: ${r.score}
<br>Top stores: 80+
<br>You are underperforming
`;

document.getElementById("primary").innerText = r.primary_failure;

document.getElementById("dist").innerHTML =
(r.revenue_distribution || []).map(d =>
`${d.name} → ${d.percent}% (~$${d.amount})`
).join("<br>");

document.getElementById("issues").innerHTML =
(r.issues || []).map(i => `
<b>${i.title}</b><br>
${i.reason}<br>
💰 $${i.impact_value}/month<br><br>
`).join("");

document.getElementById("steps").innerHTML =
(r.execution_plan || []).map(s =>
`• ${s.title} → ${s.impact}`
).join("<br>");

document.getElementById("cta").innerText =
`Stop Losing $${daily}/day`;

})();
</script>

</body>
</html>
