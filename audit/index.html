<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap');
* { box-sizing: border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#080808; color:#e8e8e8; -webkit-font-smoothing:antialiased; line-height:1.6; }
body::before { content:""; position:fixed; top:0;left:0; width:100%;height:100%; background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(249,115,22,0.12),transparent); pointer-events:none; z-index:0; }
a { color:inherit; text-decoration:none; }
/* NAV - landing style */
.nav { padding: 24px 28px; max-width: 860px; margin: 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; position: relative; z-index: 10; }
.nav-brand { display: flex; flex-direction: column; gap: 0; flex-shrink: 0; }
.nav-logo { font-weight: 800; font-size: 20px; color: #fff; letter-spacing: -0.4px; text-decoration: none; display: block; line-height: 1.2; }
.nav-logo span { color: #f97316; }
.nav-subline { font-size: 13px; color: #f97316; font-weight: 700; letter-spacing: -0.02em; margin-top: 3px; }
.nav-tagline-long { font-size: 11.5px; color: #555; line-height: 1.55; max-width: 400px; margin-top: 7px; font-weight: 400; }
.nav-links { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; flex-shrink: 0; padding-top: 2px; }
.nav-links a { font-size: 12px; color: #999; text-decoration: none; border: 1px solid #1e1e1e; padding: 5px 12px; border-radius: 8px; transition: all 0.2s; font-weight: 500; white-space: nowrap; }
.nav-links a:hover { color: #f97316; border-color: rgba(249,115,22,0.4); }
.nav-links a.research { color: #EF9F27; border-color: rgba(239,159,39,0.3); background: rgba(239,159,39,0.06); }
.nav-links a.framework { color: #1D9E75; border-color: rgba(29,158,117,0.3); background: rgba(29,158,117,0.06); }
.nav-links a.cta-nav { background: #f97316; color: #000; font-weight: 700; border-color: #f97316; }
.nav-links a.cta-nav:hover { background: #ea580c; }
@media (max-width: 700px) { .nav { flex-direction: column; padding: 16px 20px; gap: 14px; } .nav-links { flex-wrap: wrap; } }
/* LAYOUT */
.page { position:relative; z-index:1; }
.container { max-width:860px; margin:0 auto; padding:28px 28px 56px; }
#loadingState { text-align:center; padding:80px 20px; font-size:15px; color:#9a9a9a; }
50%{opacity:0.3;} }
/* DOMAIN + LOSS */
.domain-label { font-size:14px; color:#aaa; margin-bottom:8px; font-weight:500; }
.loss-number { font-size:64px; font-weight:800; color:#E24B4A; line-height:1; margin-bottom:4px; letter-spacing:-0.02em; }
.loss-label { font-size:14px; color:#aaa; margin-bottom:8px; }
.daily-loss { font-size:18px; color:#EF9F27; font-weight:600; margin-bottom:6px; }
/* SCORES */
.scores-section { background:#111; border:1px solid #1e1e1e; border-radius:16px; padding:18px 20px; margin-bottom:8px; }
.score-row { display:flex; align-items:center; gap:14px; margin-bottom:6px; }
.score-label { font-size:12px; color:#aaa; text-transform:uppercase; letter-spacing:0.06em; font-weight:600; min-width:130px; }
.score-num { font-size:22px; font-weight:700; min-width:65px; line-height:1; }
.score-bar-wrap { flex:1; height:7px; background:#1e1e1e; border-radius:999px; overflow:hidden; }
.score-bar-fill { height:100%; border-radius:999px; transition:width 1.2s ease; }
.score-verdict { font-size:12px; font-weight:600; padding-left:144px; margin-bottom:16px; line-height:1.4; }
/* FACTORS BOX */
.factors-box { background:#0d0d0d; border:1px solid #1e1e1e; border-radius:12px; padding:18px 20px; margin-top:4px; }
.factors-box-title { font-size:13px; font-weight:700; color:#ddd; margin-bottom:4px; }
.factors-box-desc { font-size:12px; color:#a5a5a5; line-height:1.5; margin-bottom:14px; }
.factor-row { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #141414; }
.factor-row:last-child { border-bottom:none; }
.factor-left { flex:1; }
.factor-name { font-size:13px; color:#aaa; margin-bottom:4px; }
.factor-bar { height:4px; background:#1a1a1a; border-radius:999px; overflow:hidden; }
.factor-fill { height:100%; border-radius:999px; }
.factor-score { font-size:13px; font-weight:700; min-width:50px; text-align:right; }
/* EXPLAIN */
.explain-toggle { font-size:13px; color:#f97316; cursor:pointer; text-align:center; padding:10px; margin-bottom:16px; user-select:none; }
.explain-box { display:none; background:#0d0d0d; border:1px solid #1e1e1e; border-radius:12px; padding:16px 18px; margin-bottom:20px; font-size:13px; color:#aaa; line-height:1.8; }
.explain-box.open { display:block; }
.explain-title { font-size:14px; font-weight:700; color:#ddd; margin-bottom:12px; }
.explain-item { margin-bottom:10px; }
.explain-highlight { color:#f97316; font-weight:600; }
/* SECTION LABEL */
.section-label { font-size:10px; color:#aaa; text-transform:uppercase; letter-spacing:0.1em; font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.section-label::after { content:""; flex:1; height:1px; background:#1a1a1a; }
/* MAIN LEAK */
.main-leak-box { background:#111; border:1px solid #1e1e1e; border-left:3px solid #E24B4A; border-radius:12px; padding:16px 18px; margin-bottom:24px; }
.main-leak-text { font-size:16px; color:#e8e8e8; font-weight:500; line-height:1.6; }
/* AGENTIC */
.agentic-box { background:#0d0d0d; border:1px solid #1e1e1e; border-radius:12px; padding:16px 18px; margin-bottom:20px; }
.agentic-title { font-size:13px; font-weight:700; color:#ddd; margin-bottom:4px; }
.agentic-desc { font-size:12px; color:#a5a5a5; margin-bottom:14px; }
.agentic-row { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #141414; }
.agentic-row:last-of-type { border-bottom:none; }
.agentic-file { font-size:13px; color:#aaa; font-family:monospace; }
.agentic-status-ok { font-size:12px; font-weight:700; color:#1D9E75; }
.agentic-status-bad { font-size:12px; font-weight:700; color:#E24B4A; }
.agentic-quality { font-size:11px; color:#9a9a9a; margin-top:10px; padding-top:10px; border-top:1px solid #1a1a1a; line-height:1.6; }
/* ISSUE CARDS */
.execution-cards { display:flex; flex-direction:column; gap:16px; margin-bottom:28px; }
.exec-card { border-radius:16px; overflow:hidden; border:1px solid; transition:all 0.25s; }
.exec-card:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(0,0,0,0.5); }
.exec-card-1 { background:rgba(226,75,74,0.05); border-color:rgba(226,75,74,0.2); }
.exec-card-2 { background:rgba(239,159,39,0.05); border-color:rgba(239,159,39,0.2); }
.exec-card-3 { background:rgba(249,115,22,0.05); border-color:rgba(249,115,22,0.2); }
.exec-card-4 { background:rgba(29,158,117,0.05); border-color:rgba(29,158,117,0.2); }
.exec-card-header { padding:16px 18px 14px; border-bottom:1px solid rgba(255,255,255,0.04); display:flex; align-items:flex-start; gap:14px; }
.exec-num { width:32px;height:32px; border-radius:10px; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
.exec-card-1 .exec-num { background:rgba(226,75,74,0.12); color:#E24B4A; }
.exec-card-2 .exec-num { background:rgba(239,159,39,0.12); color:#EF9F27; }
.exec-card-3 .exec-num { background:rgba(249,115,22,0.12); color:#f97316; }
.exec-card-4 .exec-num { background:rgba(29,158,117,0.12); color:#1D9E75; }
.exec-card-title { font-size:15px; font-weight:600; color:#e8e8e8; line-height:1.4; margin-bottom:4px; }
.exec-card-1 .exec-card-impact { color:#E24B4A; font-size:13px; font-weight:700; }
.exec-card-2 .exec-card-impact { color:#EF9F27; font-size:13px; font-weight:700; }
.exec-card-3 .exec-card-impact { color:#f97316; font-size:13px; font-weight:700; }
.exec-card-4 .exec-card-impact { color:#1D9E75; font-size:13px; font-weight:700; }
.exec-card-body { padding:14px 18px; }
.exec-reason { font-size:14px; color:#aaa; line-height:1.6; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid rgba(255,255,255,0.04); }
.exec-fix-label { font-size:10px; color:#1D9E75; text-transform:uppercase; letter-spacing:0.08em; font-weight:700; margin-bottom:8px; }
.exec-fix-text { font-size:14px; color:#4ade80; line-height:1.6; margin-bottom:12px; }
.exec-steps { list-style:none; padding:0; margin:0 0 12px 0; counter-reset:step-counter; }
.exec-step { font-size:13px; color:#999; padding:6px 0 6px 24px; position:relative; line-height:1.5; border-bottom:1px solid rgba(255,255,255,0.04); }
.exec-step:last-child { border-bottom:none; }
.exec-step::before { content:counter(step-counter); counter-increment:step-counter; position:absolute; left:0; top:7px; font-size:10px; font-weight:700; color:#9a9a9a; width:16px;height:16px; background:#1a1a1a; border-radius:50%; display:flex; align-items:center; justify-content:center; }
.exec-footer { padding:10px 18px; background:rgba(0,0,0,0.2); border-top:1px solid rgba(255,255,255,0.04); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px; }
.exec-timeline { font-size:11px; color:#a5a5a5; }
.exec-impact-time { font-size:11px; color:#1D9E75; font-weight:600; }
.priority-critical { font-size:11px; font-weight:700; color:#E24B4A; }
.priority-high { font-size:11px; font-weight:700; color:#EF9F27; }
.priority-medium { font-size:11px; font-weight:700; color:#f97316; }
.priority-low { font-size:11px; font-weight:700; color:#1D9E75; }
/* DELIVERABLE BOX */
.deliverable-box { background:#111; border:1px solid #1e1e1e; border-radius:16px; padding:20px; margin-bottom:20px; }
.deliverable-title { font-size:15px; font-weight:700; color:#e8e8e8; margin-bottom:4px; }
.deliverable-desc { font-size:13px; color:#a5a5a5; margin-bottom:14px; }
/* CHECKLIST */
.checklist-item { display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid #1a1a1a; }
.checklist-item:last-child { border-bottom:none; }
.checklist-week { font-size:10px; color:#9a9a9a; text-transform:uppercase; letter-spacing:0.06em; font-weight:700; min-width:44px; margin-top:2px; }
.checklist-priority { font-size:10px; font-weight:700; text-transform:uppercase; min-width:50px; margin-top:2px; }
.checklist-priority.critical { color:#E24B4A; }
.checklist-priority.medium { color:#EF9F27; }
.checklist-priority.low { color:#1D9E75; }
.checklist-content { flex:1; }
.checklist-action { font-size:13px; color:#ddd; line-height:1.5; margin-bottom:3px; }
.checklist-meta { font-size:11px; color:#9a9a9a; }
.checklist-yourself { font-size:10px; font-weight:700; color:#1D9E75; }
.checklist-delegate { font-size:10px; font-weight:700; color:#EF9F27; }
/* WALKTHROUGH */
.walkthrough-section { margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid #1a1a1a; }
.walkthrough-section:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
.walkthrough-heading { font-size:14px; font-weight:700; color:#f97316; margin-bottom:6px; }
.walkthrough-text { font-size:13px; color:#aaa; line-height:1.7; }
/* PROMPTS */
.prompt-item { background:#0d0d0d; border:1px solid #1e1e1e; border-radius:10px; padding:14px; margin-bottom:10px; }
.prompt-item:last-child { margin-bottom:0; }
.prompt-title { font-size:12px; font-weight:700; color:#f97316; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:8px; }
.prompt-text { font-size:12px; color:#888; line-height:1.6; font-family:monospace; background:#0a0a0a; border:1px solid #1a1a1a; border-radius:8px; padding:10px 12px; white-space:pre-wrap; word-break:break-word; }
.copy-btn { margin-top:8px; font-size:11px; color:#9a9a9a; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:6px; padding:4px 10px; cursor:pointer; transition:all 0.2s; }
.copy-btn:hover { color:#f97316; border-color:#f97316; }
/* CODE BOXES */
.code-box { font-size:12px; color:#4ade80; line-height:1.6; font-family:monospace; background:#0a0a0a; border:1px solid #1a2e1a; border-radius:10px; padding:14px; white-space:pre-wrap; word-break:break-word; max-height:240px; overflow-y:auto; }
.schema-code-box { font-size:12px; color:#60a5fa; line-height:1.6; font-family:monospace; background:#0a0a0a; border:1px solid #1a2e60; border-radius:10px; padding:14px; white-space:pre-wrap; word-break:break-word; max-height:240px; overflow-y:auto; }
/* REVENUE BOX */
.revenue-box { background:#111; border:1px solid #1e1e1e; border-radius:12px; padding:16px 18px; margin-bottom:24px; }
.revenue-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #1a1a1a; }
.revenue-row:last-child { border-bottom:none; padding-bottom:0; }
.revenue-row-label { font-size:13px; color:#888; }
.revenue-row-value { font-size:16px; font-weight:700; }
/* PDF BTN */
.pdf-btn { display:block; width:100%; padding:16px; border-radius:12px; background:#111; border:1px solid #2a2a2a; color:#aaa; font-size:14px; font-weight:600; text-align:center; cursor:pointer; transition:all 0.2s; margin-bottom:24px; text-decoration:none; }
.pdf-btn:hover { color:#ccc; border-color:#8a8a8a; background:#161616; }
/* FOUNDER */
.founder-box { background:#0d0d0d; border:1px solid #1e1e1e; border-left:3px solid #f97316; border-radius:12px; padding:18px 20px; margin-bottom:24px; display:flex; gap:16px; align-items:flex-start; }
.founder-avatar { width:44px;height:44px; background:linear-gradient(135deg,#f97316,#ea580c); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:900; color:#000; flex-shrink:0; }
.founder-text { flex:1; }
.founder-name { font-size:13px; font-weight:700; color:#e8e8e8; margin-bottom:4px; }
.founder-sub { font-size:11px; color:#a5a5a5; margin-bottom:8px; }
.founder-quote { font-size:13px; color:#aaa; line-height:1.7; font-style:italic; }
/* DFY BOX */
.dfy-box { background:#0f0f0f; border:1px solid #f97316; border-radius:16px; padding:20px; margin-bottom:24px; position:relative; overflow:hidden; }
.dfy-box::before { content:""; position:absolute; inset:0; background:linear-gradient(135deg,rgba(249,115,22,0.06),transparent 60%); pointer-events:none; }
.dfy-tag { display:inline-block; background:rgba(249,115,22,0.15); color:#f97316; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.1em; padding:3px 10px; border-radius:999px; margin-bottom:10px; }
.dfy-title { font-size:16px; font-weight:700; color:#fff; margin-bottom:8px; }
.dfy-desc { font-size:14px; color:#aaa; line-height:1.6; margin-bottom:14px; }
.dfy-features { list-style:none; padding:0; margin:0 0 16px 0; }
.dfy-feature { font-size:13px; color:#888; padding:4px 0; }
.dfy-feature::before { content:"+ "; color:#f97316; font-weight:700; }
.dfy-price { font-size:13px; color:#a5a5a5; margin-bottom:14px; }
.dfy-price strong { color:#f97316; font-size:15px; }
.dfy-cta { display:block; width:100%; padding:18px; border-radius:14px; border:2px solid #dc2626; background:linear-gradient(135deg,#f97316,#ea580c); color:#000; font-weight:900; font-size:17px; text-align:center; cursor:pointer; text-decoration:none; transition:all 0.25s; box-shadow:0 10px 25px rgba(249,115,22,0.35); }
.dfy-cta:hover { transform:translateY(-2px); box-shadow:0 16px 35px rgba(249,115,22,0.6); }
/* FOOTER - landing style */
.footer { padding: 32px 0 12px; margin-top: 32px; border-top: 1px solid #111; }
.footer-inner { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
.footer-left { font-size: 12px; color: #444; line-height: 2; }
.footer-left a { color: #555; text-decoration: none; }
.footer-left a:hover { color: #f97316; }
.footer-right { font-size: 14px; font-weight: 700; color: #f97316; letter-spacing: 0.04em; text-align: right; }
.footer-platform { font-size: 10px; color: #333; text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; text-align: right; }
.footer-social { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.footer-social a { color: #444; transition: color 0.2s; }
.footer-social a:hover { color: #f97316; }
@media (max-width:480px) {
  .loss-number { font-size:52px; }
  .score-label { min-width:100px; font-size:11px; }
  .score-num { font-size:20px; min-width:55px; }
  .score-verdict { padding-left:115px; }
}

body { font-feature-settings: "ss01","cv01"; }
.loss-number, .score-num, .score-circle-num, .stat-num,
.exec-card-title, .deliverable-title, .section-title, .cta-title, .dfy-title {
  font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
}
body::before {
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, rgba(249,115,22,0.16), transparent 60%),
    radial-gradient(ellipse 50% 40% at 90% 20%, rgba(96,165,250,0.05), transparent 55%);
}
body::after {
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  background-size: 56px 56px;
  mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%);
}
.loss-number {
  background: linear-gradient(180deg, #ff6b4a 0%, #E24B4A 70%);

  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 4px 24px rgba(226,75,74,0.35));
  letter-spacing: -0.03em;
}
.score-num { text-shadow: 0 0 28px currentColor; opacity:0.98; }
.score-circle-wrap::after {

  box-shadow: 0 0 50px 0 rgba(249,115,22,0.12); pointer-events:none;

.exec-card { backdrop-filter: blur(4px); }
.exec-card:hover { transform: translateY(-3px) scale(1.005); }
.factor-fill, .score-bar-fill { box-shadow: 0 0 12px -2px currentColor; }
.section-label { color:#bcbcbc; font-size:11px; letter-spacing:0.14em; }
.section-label::after { background: linear-gradient(90deg, #2a2a2a, transparent); }
.deliverable-title { font-size:16px; letter-spacing:-0.01em; }
.deliverable-desc { font-size:13.5px; color:#9a9a9a; }
.main-leak-text { font-size:16.5px; }
.exec-card-title { font-size:15.5px; letter-spacing:-0.01em; }
.exec-reason { font-size:14px; color:#bdbdbd; }
.exec-fix-text { font-size:14px; }
.exec-step { font-size:13.5px; color:#a8a8a8; }
.checklist-action { font-size:13.5px; color:#e2e2e2; }
.checklist-meta { font-size:12px; color:#8f8f8f; }
.walkthrough-text { font-size:13.5px; color:#b3b3b3; }
.prompt-text { font-size:12.5px; color:#9aa0a6; }
.founder-quote { font-size:13.5px; color:#b3b3b3; }
.agentic-desc { font-size:12.5px; color:#9a9a9a; }
.agentic-quality { font-size:12px; color:#888; }
.loss-label { font-size:15px; color:#bdbdbd; }
.daily-loss { font-size:17px; }
.dfy-box { box-shadow: 0 20px 60px -20px rgba(249,115,22,0.25); }
.dfy-title { font-size:18px; }
#app { animation: auditFadeUp 0.6s ease both; }
@keyframes auditFadeUp { from { opacity:0; transform: translateY(12px);} to {opacity:1; transform:none;} }

function toggleExplain() {
  const box = document.getElementById("explainBox");
  const toggle = document.querySelector(".explain-toggle");
  if (!box) return;
  const isOpen = box.classList.contains("open");
  box.classList.toggle("open");
  toggle.innerHTML = isOpen ? "&#9658; What does this score mean?" : "&#9660; What does this score mean?";
}
function copyText(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText || el.textContent).then(() => {
    const orig = btn.innerText;
    btn.innerText = "Copied!";
    btn.style.color = "#4ade80";
    setTimeout(() => { btn.innerText = orig; btn.style.color = ""; }, 2000);
  }).catch(() => {
    const range = document.createRange();
    range.selectNode(el);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);
    document.execCommand("copy");
  });
}
