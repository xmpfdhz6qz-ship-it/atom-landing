<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
  background:#0A0A0A;
  color:#fff;
  margin:0;
  padding:16px;
}
.container {max-width:700px;margin:auto;}

.card {
  background:#111;
  border:1px solid #222;
  border-radius:20px;
  padding:24px;
  margin-top:16px;
}

.section-title {
  font-size:11px;
  text-transform:uppercase;
  color:#666;
  margin-bottom:8px;
}

.big-money {
  font-size:40px;
  font-weight:900;
  color:#ef4444;
}

.score {
  font-size:52px;
  font-weight:900;
  color:#22c55e;
}

.sub {color:#999;margin-top:6px;line-height:1.6;}

.alert {
  background:#1a0f0f;
  border:1px solid #7f1d1d;
  padding:16px;
  border-radius:14px;
  color:#fca5a5;
  margin-top:16px;
  font-weight:600;
}

.issue {
  border-top:1px solid #7f1d1d;
  padding:22px 0;
}

.fix {
  border:1px solid #14532d;
  background:#052e1a;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.cta {
  display:block;
  padding:22px;
  background:#f97316;
  color:#000;
  text-align:center;
  border-radius:16px;
  font-weight:900;
  margin-top:16px;
  text-decoration:none;
  font-size:18px;
}
</style>
</head>

<body>
<div class="container">

<div class="card">
  <div class="section-title">Conversion Intelligence Audit</div>
  <div id="storeName"></div>

  <div class="big-money" id="heroLoss"></div>
  <div class="sub" id="dailyLoss"></div>

  <div class="score" id="score"></div>
  <div class="sub" id="scoreLabel"></div>

  <div class="sub">Confidence: <b id="confidence"></b></div>
</div>

<div class="alert">
⚠️ You are not losing traffic. You are losing buyers.
</div>

<div class="card">
  <div class="section-title">Live Revenue Loss</div>
  <div id="liveLoss"></div>
</div>

<div class="card">
  <div class="section-title">Revenue Opportunity</div>
  <div id="dashboard"></div>
</div>

<div class="card">
  <div class="section-title">Primary Failure</div>
  <div id="primary"></div>
</div>

<div class="card">
  <div class="section-title">Where Money Is Lost</div>
  <div id="priority"></div>
</div>

<div class="card">
  <div class="section-title">Revenue Recovery Plan</div>
  <div id="plan"></div>
</div>

<div class="card">
  <div class="section-title">Conversion Leaks</div>
  <div id="issues"></div>
</div>

<div class="card">
  <div class="section-title">Execution Plan</div>
  <div id="steps"></div>
</div>

<div class="card">
  <div class="section-title">How This Was Calculated</div>
  <div id="assumptions"></div>
</div>

<div class="card">
  <a href="#" class="cta" id="cta"></a>
  <div class="sub" style="text-align:center;margin-top:10px;">
    Every day you delay = <span id="daily"></span> lost
  </div>
</div>

</div>

<script>
(async function(){

const token = window.location.pathname.split("/").pop();
if (!token) return;

const res = await fetch(`https://n8n-production-d989b.up.railway.app/webhook/get-audit?token=${token}`);
const data = await res.json();

const r = data.report_json || data;
const calc = r.revenue_calculation || {};
const issues = r.issues || [];

const monthly = Number(calc.monthly_loss_value || 10000);
const daily = Number(calc.daily_loss_value || Math.round(monthly/30));

// HEADER
document.getElementById("storeName").innerText = data.domain;
document.getElementById("score").innerText = (r.score || 70) + "/100";
document.getElementById("confidence").innerText = r.analysis_confidence || "medium";

function label(s){
if(s>80)return"Strong performance";
if(s>60)return"Good foundation but leaking revenue";
if(s>40)return"Serious issues";
return"Critical leaks";
}
document.getElementById("scoreLabel").innerText = label(r.score || 70);

document.getElementById("heroLoss").innerText = `$${monthly.toLocaleString()}+ / month`;
document.getElementById("dailyLoss").innerText = `≈ $${daily} lost every day`;
document.getElementById("daily").innerText = `$${daily}`;

// LOSS
document.getElementById("liveLoss").innerHTML = `
Last 7 days: ~$${(daily*7).toLocaleString()}<br>
Last 30 days: ~$${(daily*30).toLocaleString()}
`;

// DASHBOARD
document.getElementById("dashboard").innerHTML = `
Current CVR: ${calc.current_cvr || 1.2}%<br>
Potential CVR: ${calc.potential_cvr || 1.6}%<br><br>
+$${monthly.toLocaleString()}/month
`;

// PRIMARY
document.getElementById("primary").innerText = r.primary_failure || "";

// 🔥 FIX DISTRIBUTION
document.getElementById("priority").innerHTML =
(r.revenue_distribution || []).map(d =>
`${d.name} → ${d.percent || 0}% (~$${(d.amount || 0).toLocaleString()})`
).join("<br>") || "No data available";

// 🔥 FIX PLAN
document.getElementById("plan").innerHTML =
(r.revenue_plan || []).map(p => `
<b>${p.fix}</b><br>
💰 +$${(p.impact_value || p.impact || 0).toLocaleString()}/month<br><br>
`).join("") || "No recovery plan generated";

// 🔥 FIX ISSUES
document.getElementById("issues").innerHTML =
issues.map(i => `
<div class="issue">
<strong>${i.title}</strong>
<p>${i.reason}</p>

<div class="fix">
💰 $${(i.impact_value || i.monthly_impact || 0).toLocaleString()}/month<br>
⏱ ${i.recovery_time || "1–3 days"}<br><br>
${i.fix}
</div>
</div>
`).join("") || "No issues detected";

// 🔥 FIX EXECUTION
document.getElementById("steps").innerHTML =
(r.execution_plan || []).map(s =>
`• ${s.title} → ${s.impact || "$0"}`
).join("<br>") || "No execution plan available";

document.getElementById("assumptions").innerText =
calc.assumptions || "";

// CTA
document.getElementById("cta").innerText =
`Stop Losing $${daily}/day → Activate Monitoring ($89/month)`;

})();
</script>

</body>
</html>
