<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conversion Audit Report</title>

<style>
/* --- DESIGN BEZE ZMĚN --- */
body {
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial;
  background: linear-gradient(180deg,#f8fafc 0%, #eef2ff 100%);
  color: #0f172a;
  margin: 0;
  padding: 14px;
}
.container { max-width: 720px; margin: auto; }
.hero { background:white; padding:18px; border-radius:18px; box-shadow:0 20px 60px rgba(15,23,42,0.08); }
h1 { font-size:20px; margin-bottom:4px; }
.store { font-size:16px; color:#64748b; margin-bottom:8px; }
.score { font-size:52px; font-weight:900; color:#16a34a; }
.bad { color:#dc2626; font-weight:700; font-size:16px; margin-top:4px; }
.meta { margin-top:10px; font-size:13px; color:#64748b; }
.alert { margin-top:16px; padding:14px; background:#fef2f2; border:1px solid #fecaca; border-radius:14px; font-weight:600; }
.money { margin-top:16px; padding:18px; border-radius:16px; background:#fff1f2; border:1px solid #fecaca; text-align:center; }
.money strong { font-size:28px; color:#dc2626; display:block; }
.money span { display:block; font-size:13px; color:#64748b; margin-top:6px; }
.daily { margin-top:10px; font-size:14px; font-weight:700; color:#dc2626; }
.card { padding:16px; border-radius:16px; margin-top:16px; background:white; border:1px solid #e2e8f0; }
.card-problem { background:#fff1f2; }
.card-fix { background:#f0fdf4; }
.section-title { font-weight:700; font-size:12px; color:#64748b; text-transform:uppercase; margin-bottom:6px; }
.compare-box { padding:12px; border-radius:12px; margin-top:8px; }
.before { background:#fff1f2; }
.after { background:#f0fdf4; }
.value-list { list-style:none; padding-left:0; }
.value-list li { margin-bottom:12px; }
.value-list strong { display:block; }
.leak-item { margin-top:10px; padding:12px; border-radius:12px; background:#fff1f2; }
.plan-item { margin-top:10px; padding:12px; border-radius:12px; background:#f0fdf4; }
.cta-box { margin-top:28px; padding:18px; background:white; border-radius:18px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,0.06); }
.cta { display:block; margin-top:12px; padding:16px; background:linear-gradient(135deg,#059669,#047857); color:white; border-radius:14px; font-weight:800; font-size:16px; text-decoration:none; }
.download { margin-top:10px; width:100%; padding:14px; border:none; border-radius:12px; background:#0f172a; color:white; }
.small { font-size:12px; color:#94a3b8; margin-top:10px; text-align:center; line-height:1.6; }
.benefits { margin-top:12px; font-size:13px; color:#334155; text-align:left; }
.print-cover { display:none; }
.print-footer { display:none; }
</style>
</head>

<body>

<div class="container">

<div class="hero">
<h1>Store Conversion Audit</h1>
<div id="storeName" class="store"></div>
<div class="score" id="score"></div>
<div class="bad">This Store Is Losing Revenue Every Day</div>
<div class="meta">Estimated Revenue Loss: <strong>10–30%</strong></div>
</div>

<div class="alert">
⚠️ Visitors are leaving without buying — revenue is being lost right now
</div>

<div class="money">
<strong>$2,000 – $8,000</strong>
<div class="daily" id="daily"></div>
</div>

<div class="card card-problem">
<p id="main"></p>
</div>

<div class="card card-fix">
<p id="fix"></p>
</div>

</div>

<script>
(async function(){

// ✅ FIX: token z URL (/audit/xxx)
const path = window.location.pathname;
const token = path.split("/").pop();

if (!token) {
  console.error("No token found");
  return;
}

try {

const res = await fetch(
`https://n8n-production-d989b.up.railway.app/webhook/b8ebbab5-7674-4bd3-8963-aff95e971c81/webhook?token=${token}`
);

const data = await res.json();
const report = data.report_json || data;

// fallback pro naming
const mainLeak = report.main_leak || report.main_leak_1 || "";
const quickFix = report.quick_fix || report.quick_fix_1 || "";

document.getElementById("storeName").innerText = data.store_domain || data.domain || "";
document.getElementById("score").innerText = `${data.score || 0}/100`;
document.getElementById("main").innerText = mainLeak;
document.getElementById("fix").innerText = quickFix;

const low = 2000;
const high = 8000;

document.getElementById("daily").innerText =
`Estimated daily loss: ~$${Math.round(low/30)}–$${Math.round(high/30)}`;

} catch(e){
  console.error(e);
  document.getElementById("score").innerText = "Error";
}

})();
</script>

</body>
</html>
