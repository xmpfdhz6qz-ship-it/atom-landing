<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Store Report – Atom Foundry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
  background:#0A0A0A;
  color:white;
  -webkit-font-smoothing:antialiased;
  padding:16px;
  line-height:1.7;
}

.container {
  max-width:560px;
  width:100%;
  margin:0 auto;
  text-align:center;
}

.container::before {
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:radial-gradient(circle at 50% -20%, rgba(249,115,22,0.15), transparent 40%);
  pointer-events:none;
  z-index:0;
}

h1 {
  font-size:26px;
  margin-bottom:10px;
  line-height:1.3;
  font-weight:900;
}

.card {
  background:#111;
  padding:18px;
  border-radius:16px;
  margin-top:14px;
  border:1px solid #222;
  text-align:left;
  box-shadow:0 8px 24px rgba(0,0,0,0.6);
  position:relative;
  z-index:1;
  transition:all 0.3s ease;
}

.card:hover {
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(0,0,0,0.8);
}

.red {
  border-color:#dc2626;
  background:linear-gradient(180deg,#1a0f0f,#0f0a0a);
  box-shadow:0 0 0 1px rgba(220,38,38,0.4);
}

.green {
  border-color:#14532d;
  background:#052e16;
}

.highlight {
  text-align:center;
}

.score {
  font-size:56px;
  font-weight:900;
  margin-top:6px;
}

.money {
  font-size:40px;
  font-weight:900;
  color:#ef4444;
  margin-top:6px;
  text-shadow:0 0 25px rgba(239,68,68,0.5);
}

.cta-zone {
  margin-top:20px;
  padding:18px;
  border-radius:16px;
  background:linear-gradient(180deg,rgba(249,115,22,0.08),rgba(0,0,0,0));
  border:1px solid rgba(249,115,22,0.3);
  box-shadow:0 0 30px rgba(249,115,22,0.15);
}

.cta {
  display:block;
  padding:22px;
  border-radius:14px;
  background:linear-gradient(135deg,#f97316,#ea580c);
  color:black;
  text-decoration:none;
  font-weight:900;
  text-align:center;
  font-size:20px;
  border:2px solid #dc2626;
  box-shadow:0 12px 30px rgba(249,115,22,0.5);
  transition:all 0.25s ease;
  cursor:pointer;
  animation:pulse 2s infinite;
}

.cta:hover {
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 20px 50px rgba(249,115,22,0.8);
}

.cta:active {
  transform:scale(0.95);
}

@keyframes pulse {
  0% {box-shadow:0 0 0 rgba(249,115,22,0.4);}
  50% {box-shadow:0 0 35px rgba(249,115,22,0.7);}
  100% {box-shadow:0 0 0 rgba(249,115,22,0.4);}
}

.subtle {
  font-size:12px;
  color:#94a3b8;
  margin-top:10px;
  text-align:center;
}

.small {
  font-size:13px;
  color:#cbd5f5;
}

.warning {
  color:#f87171;
  font-size:13px;
  margin-top:6px;
}

.urgency {
  margin-top:10px;
  font-size:14px;
  font-weight:700;
}

.live-loss {
  font-size:18px;
  font-weight:700;
  color:#f87171;
  margin-top:10px;
  text-align:center;
}

.trust {
  font-size:13px;
  color:#9ca3af;
  margin-top:8px;
}

.decision {
  margin-top:14px;
  font-size:14px;
  color:#e5e7eb;
}
</style>
</head>

<body>

<div class="container">
<div id="app">Analyzing your store...</div>
</div>

<script>
const app = document.getElementById("app");

const params = new URLSearchParams(window.location.search);
let id = params.get("token");

if (!id) {
  const parts = window.location.pathname.split("/");
  id = parts[parts.length - 1];
}

if (!id || id === "scan") {
  app.innerText = "Missing scan token";
  throw new Error("Missing token");
}

(async function(){

let data = null;

try {
  const res = await fetch(`https://n8n-production-43ab.up.railway.app/webhook/get-scan?token=${id}`);
  const raw = await res.json();
  data = Array.isArray(raw) ? raw[0] : raw;
} catch (e) {
  console.error("API failed", e);
}

if (!data) {
  app.innerText = "Failed to load report.";
  return;
}

const row = data;
const report = row.report_json || {};

/* 🔥 FIXED LOSS FROM BACKEND */
const min = report.estimated_loss_min || 0;
const max = report.estimated_loss_max || 0;

function formatMoney(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

const lossRange = `$${formatMoney(min)} – $${formatMoney(max)}`;
const daily = Math.round(min / 30);
const hourly = Math.round(daily / 24);

/* DATA */
const estimatedLossText = report.estimated_loss || "";
const urgencyText = report.urgency || "";
const impactText = report.impact_explanation || "Users cannot confidently decide whether to proceed";
const severity = report.severity || "";

/* CTA */
const ctaText = "See Full Revenue Breakdown →";

/* COLOR */
const urgencyColor = "#ef4444";

app.innerHTML = `

<!-- 🔥 ZMĚNA 1: HERO -->
<h1>YOU ARE LOSING</h1>

<div class="money">${lossRange}/month</div>

<div class="live-loss">
  $${daily}/day • $${hourly}/hour
</div>

<div class="warning">
  This is happening right now.
</div>

<!-- 🔥 ZMĚNA 2: REALITY SLAP -->
<div class="card red">
  <strong>Right now:</strong><br><br>

  Users are visiting your store.<br>
  They are ready to buy.<br><br>

  <b>They don't.</b><br><br>

  Not because of your product.<br>
  Not because of price.<br><br>

  Because something in your funnel breaks their decision.
</div>

<div class="card red highlight">
  <div class="small">Estimated revenue loss</div>
  <div class="money">${lossRange}</div>

  <div style="margin-top:8px;font-size:14px;">
    ${estimatedLossText}
  </div>

  <div class="urgency" style="color:${urgencyColor}">
    $${daily} / day at risk
  </div>

  <div class="warning">+$${hourly} at risk every hour</div>

  <div id="liveLoss" class="live-loss">Calculating...</div>

  <div class="subtle">
    Based on observed patterns and estimated traffic — actual impact may vary
  </div>
</div>

<!-- 🔥 ZMĚNA 3: WHAT THIS MEANS -->
<div class="card">
  <strong>What is actually happening:</strong><br><br>

  Users reach the decision moment<br>
  → hesitate<br>
  → leave<br><br>

  This repeats every day.

  <div class="urgency" style="color:${urgencyColor}">
    ${urgencyText}
  </div>
</div>

<div class="card red" style="text-align:center;">
  <strong>This issue is likely impacting your conversions right now</strong><br><br>
  Even small improvements can recover significant revenue over time
</div>

<div class="cta-zone">
  <a id="auditBtnTop" class="cta" href="#">
    Reveal Full Audit → $399
  </a>
  <div class="subtle">⚡ Instant access • No calls • Actionable fixes</div>
  <div class="subtle" style="color:#22c55e;">
    Most stores recover this from ONE fix
  </div>
</div>

<div class="card highlight">
  <div class="small">Conversion Score</div>
  <div class="score">${row.score || 60}/100</div>
  <div class="warning">High-performing stores score 85+</div>
</div>

<div class="card">
  <div class="small">Issue severity</div>
  <div class="urgency" style="color:${urgencyColor}">
    ${
      severity === "high"
        ? "🔴 High – actively blocking conversions"
        : severity === "medium"
        ? "🟠 Medium – causing hesitation"
        : "🟢 Low – minor friction"
    }
  </div>
</div>

<div class="trust">
  Based on patterns across 1,000+ ecommerce stores
</div>

<div class="card">
  <strong>This is not random.</strong><br><br>
  → Based on real ecommerce store data<br>
  → Focused on revenue impact<br>
</div>

<!-- 🔥 ZMĚNA 4: MAIN LEAK -->
<div class="card red">
  <strong>This is where you lose buyers:</strong><br><br>
  ${report.main_leak || ""}
  <div class="urgency" style="color:${urgencyColor}">
    This is happening at the exact moment users decide whether to buy or leave
  </div>
</div>

<!-- 🔥 ZMĚNA 5: QUICK FIX DOWNGRADE -->
<div class="card green">
  <strong>One possible fix:</strong><br><br>
  ${report.quick_fix || ""}
  <div class="urgency">
    Fixing this can immediately improve conversion rate
  </div>
  <div class="warning">
    This is only a surface-level fix
  </div>
</div>

<!-- 🔥 ZMĚNA 6: FULL AUDIT TEASE -->
<div class="card red">
  <strong>You are only seeing a fraction of the problem:</strong><br><br>

  The full audit uncovers:<br><br>

  → Exact drop-off points killing conversions<br>
  → Hidden UX friction you can't see<br>
  → Real revenue impact per issue<br>
  → Prioritized fix plan<br><br>

  <div class="urgency">
    ⚠️ Most stores have 3–5 additional leaks not visible here
  </div>
</div>

<div class="card red">
  <strong>If nothing changes:</strong><br><br>
  → ~$${daily} at risk daily<br>
  → ${lossRange} at risk monthly<br>
  <div class="urgency">
    Visitors are leaving instead of converting
  </div>
</div>

<!-- 🔥 ZMĚNA 9: TIME PRESSURE LOOP -->
<div class="card red">
  <strong>Every second this continues:</strong><br><br>

  → users leave<br>
  → revenue is lost<br><br>

  <b>This does not stop.</b>
</div>

<div class="cta-zone">
  <a id="auditBtn" class="cta" href="#">
    Reveal Full Audit → $399
  </a>

  <div class="subtle">Most stores recover the cost from one fix</div>
  <div class="subtle">✔ No calls • ✔ No contracts • ✔ Immediate insights</div>
  <div class="subtle" style="color:#22c55e;">
    Most stores recover this from ONE fix
  </div>

  <div class="urgency" style="text-align:center;color:${urgencyColor};">
    Every day you wait = ~$${daily} at risk
  </div>
</div>

<!-- 🔥 ZMĚNA 10: DECISION HARDER -->
<div class="card">
  <div class="decision">
    <strong>Your decision:</strong><br><br>
    1) Ignore this → continue losing ${lossRange}/month<br>
    2) Fix it → recover this revenue starting today
  </div>
</div>
`;

const email = row?.email || "";

/* CHECKOUT */
["auditBtn","auditBtnTop"].forEach(id=>{
  const btn = document.getElementById(id);

  if(btn){
    btn.addEventListener("click", async (e) => {
      e.preventDefault();

      btn.innerText = "Redirecting...";
      btn.style.opacity = "0.7";

      try {
        const res = await fetch("https://n8n-production-43ab.up.railway.app/webhook/create-checkout", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            domain: row.store_domain || "",
            email: email || ""
          })
        });

        const data = await res.json();

        if (!data.url) {
          alert("Checkout error");
          return;
        }

        window.location.href = data.url;

      } catch (err) {
        console.error(err);
        alert("Something went wrong");
      }
    });
  }
});

/* 🔥 ZMĚNA 11: LIVE LOSS ZESÍLENÍ */
let seconds = 0;
const live = document.getElementById("liveLoss");

setInterval(() => {
  seconds++;
  const liveLoss = Math.round((hourly / 3600) * seconds);

  if (live) {
    live.innerText = `$${liveLoss} lost while you are reading this`;
  }
}, 1000);

})();
</script>

</body>
</html>
