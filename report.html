<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Store Report – Atom Foundry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto;
  background: #0A0A0A;
  color: white;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 50% -10%, rgba(249,115,22,0.12), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 28px 20px 48px;
  position: relative;
  z-index: 1;
}

.domain-label {
  font-size: 13px;
  color: #666;
  margin-bottom: 8px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.loss-number {
  font-size: 64px;
  font-weight: 800;
  color: #E24B4A;
  line-height: 1;
  margin-bottom: 4px;
  text-shadow: 0 0 40px rgba(226,75,74,0.3);
  letter-spacing: -0.02em;
}

.loss-label {
  font-size: 13px;
  color: #666;
  margin-bottom: 16px;
}

.daily-loss {
  font-size: 16px;
  color: #EF9F27;
  font-weight: 600;
  margin-bottom: 6px;
}

.live-counter {
  font-size: 13px;
  color: #555;
  margin-bottom: 24px;
  min-height: 20px;
}

.scores-section {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 16px;
  padding: 18px 20px;
  margin-bottom: 20px;
}

.score-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}

.score-row:last-child { margin-bottom: 0; }

.score-label {
  font-size: 11px;
  color: #777;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 500;
  min-width: 100px;
}

.score-num {
  font-size: 20px;
  font-weight: 700;
  min-width: 60px;
  line-height: 1;
}

.score-bar-wrap {
  flex: 1;
  height: 6px;
  background: #1e1e1e;
  border-radius: 999px;
  overflow: hidden;
}

.score-bar-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 1s ease;
}

.section-label {
  font-size: 10px;
  color: #666;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 8px;
}

.main-leak-box {
  background: #111;
  border: 1px solid #1e1e1e;
  border-left: 3px solid #E24B4A;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 20px;
}

.main-leak-text {
  font-size: 15px;
  color: #e5e5e5;
  font-weight: 500;
  line-height: 1.55;
}

.locked-box {
  background: #0d0d0d;
  border: 1px solid #1a1a1a;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 20px;
}

.locked-title {
  font-size: 11px;
  color: #555;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 12px;
  font-weight: 600;
}

.locked-item {
  font-size: 13px;
  color: #555;
  margin-bottom: 8px;
  line-height: 1.5;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}

.locked-item:last-child { margin-bottom: 0; }

.locked-icon {
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 1px;
}

.locked-text { flex: 1; }

.fix-label {
  font-size: 10px;
  color: #1D9E75;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 8px;
}

.fix-box {
  background: #0a1a0a;
  border: 1px solid #1a2a1a;
  border-left: 3px solid #1D9E75;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 20px;
}

.fix-text {
  font-size: 14px;
  color: #4ade80;
  line-height: 1.55;
}

.expiry-text {
  font-size: 12px;
  color: #555;
  text-align: center;
  margin-bottom: 14px;
}

.cta-section { margin-bottom: 24px; }

.cta-btn {
  display: block;
  width: 100%;
  padding: 20px;
  border-radius: 14px;
  border: 2px solid #dc2626;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: black;
  font-weight: 900;
  font-size: 18px;
  text-align: center;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 12px 30px rgba(249,115,22,0.4);
  transition: all 0.25s ease;
  animation: ctaPulse 2.5s infinite;
  margin-bottom: 10px;
}

.cta-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px rgba(249,115,22,0.65);
}

.cta-btn:active { transform: scale(0.97); }

@keyframes ctaPulse {
  0%   { box-shadow: 0 0 0 rgba(249,115,22,0.4); }
  50%  { box-shadow: 0 0 30px rgba(249,115,22,0.6); }
  100% { box-shadow: 0 0 0 rgba(249,115,22,0.4); }
}

.cta-trust {
  font-size: 12px;
  color: #666;
  text-align: center;
  line-height: 1.6;
}

.cta-trust-green {
  font-size: 12px;
  color: #1D9E75;
  text-align: center;
  margin-top: 4px;
}

.what-box {
  background: #111;
  border: 1px solid #1e1e1e;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 24px;
}

.what-title {
  font-size: 13px;
  font-weight: 600;
  color: #999;
  margin-bottom: 12px;
}

.what-item {
  font-size: 13px;
  color: #888;
  margin-bottom: 7px;
  padding-left: 4px;
  line-height: 1.5;
}

.what-item:last-child { margin-bottom: 0; }

.cta-btn-secondary {
  display: block;
  width: 100%;
  padding: 18px;
  border-radius: 14px;
  border: 2px solid #dc2626;
  background: linear-gradient(135deg, #f97316, #ea580c);
  color: black;
  font-weight: 900;
  font-size: 17px;
  text-align: center;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 0 10px 25px rgba(249,115,22,0.35);
  transition: all 0.25s ease;
  margin-bottom: 10px;
}

.cta-btn-secondary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 35px rgba(249,115,22,0.6);
}

.decision-box {
  background: #0d0d0d;
  border: 1px solid #1a1a1a;
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 24px;
  font-size: 13px;
  color: #777;
  line-height: 1.8;
}

.footer {
  font-size: 11px;
  color: #444;
  text-align: center;
  padding-top: 16px;
  border-top: 1px solid #111;
  line-height: 1.8;
}

#loadingState {
  text-align: center;
  padding: 60px 20px;
  font-size: 15px;
  color: #555;
}

@media (max-width: 420px) {
  .loss-number { font-size: 52px; }
  .cta-btn { font-size: 16px; padding: 18px; }
  .score-label { min-width: 80px; font-size: 10px; }
  .score-num { font-size: 18px; min-width: 50px; }
}
</style>
</head>

<body>
<div class="container">
  <div id="loadingState">Analyzing your store...</div>
  <div id="app" style="display:none;"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let id = params.get("token");

if (!id) {
  const parts = window.location.pathname.split("/");
  id = parts[parts.length - 1];
}

if (!id || id === "scan" || id === "report") {
  document.getElementById("loadingState").innerText = "Missing scan token.";
  throw new Error("Missing token");
}

(async function() {

let data = null;

try {
  const res = await fetch(
    `https://n8n-production-43ab.up.railway.app/webhook/get-scan?token=${id}`
  );
  const raw = await res.json();
  data = Array.isArray(raw) ? raw[0] : raw;
} catch(e) {
  console.error("API failed", e);
}

if (!data) {
  document.getElementById("loadingState").innerText = "Failed to load report. Please try again.";
  return;
}

const row    = data;
const report = row.report_json || {};

const domain = (row.store_domain || "")
  .replace("https://","").replace("http://","").trim();

const displayDomain = (domain && domain !== "undefined" && domain !== "null")
  ? domain : "Your store";

const lossMin = report.estimated_loss_min || row.estimated_loss_min || 0;
const lossMax = report.estimated_loss_max || row.estimated_loss_max || 0;
const daily   = report.estimated_loss_daily || Math.round(lossMin / 30);

const lossDisplay = report.estimated_loss_display
  || ("$" + lossMin.toLocaleString() + "/month");

const croScore = row.cro_score || row.score || 60;
const arsScore = row.ars_score || report.ars_score || Math.round(croScore * 0.65);

const mainLeak  = report.main_leak || "Users are not clearly guided at the moment they decide.";
const quickFix  = report.quick_fix || "Make the primary action visually dominant and reduce competing elements.";

const lockedLeaks = Array.isArray(report.locked_leaks) && report.locked_leaks.length > 0
  ? report.locked_leaks
  : [
      { title: "Checkout friction issue", est_impact: "$" + Math.round(lossMin * 0.25).toLocaleString() + "/month" },
      { title: "Mobile UX gap",           est_impact: "$" + Math.round(lossMin * 0.20).toLocaleString() + "/month" },
      { title: "AI visibility gap",       est_impact: "affecting organic discovery" }
    ];

const email = row.email || "";

const croColor = croScore >= 70 ? "#1D9E75" : croScore >= 50 ? "#EF9F27" : "#E24B4A";
const arsColor = arsScore >= 70 ? "#1D9E75" : arsScore >= 40 ? "#EF9F27" : "#E24B4A";

const lockedHTML = lockedLeaks.map(l => `
  <div class="locked-item">
    <span class="locked-icon">🔒</span>
    <span class="locked-text">${l.title}${l.est_impact
      ? ' <span style="color:#444;">· ' + l.est_impact + '</span>'
      : ''}</span>
  </div>
`).join("");

document.getElementById("loadingState").style.display = "none";
const app = document.getElementById("app");
app.style.display = "block";

app.innerHTML = `

  <div class="domain-label">${displayDomain}</div>
  <div class="loss-number">${lossDisplay}</div>
  <div class="loss-label">estimated monthly revenue loss</div>

  <div class="daily-loss">⚡ That's $${daily.toLocaleString()} every single day.</div>
  <div class="live-counter" id="liveCounter"></div>

  <div class="scores-section">
    <div class="score-row">
      <div class="score-label">CRO Score</div>
      <div class="score-num" style="color:${croColor};">${croScore}<span style="font-size:13px;color:#444;">/100</span></div>
      <div class="score-bar-wrap">
        <div class="score-bar-fill" id="croBar" style="width:0%;background:${croColor};"></div>
      </div>
    </div>
    <div class="score-row">
      <div class="score-label">AI Readiness</div>
      <div class="score-num" style="color:${arsColor};">${arsScore}<span style="font-size:13px;color:#444;">/100</span></div>
      <div class="score-bar-wrap">
        <div class="score-bar-fill" id="arsBar" style="width:0%;background:${arsColor};"></div>
      </div>
    </div>
  </div>

  <div class="section-label">Main leak detected</div>
  <div class="main-leak-box">
    <div class="main-leak-text">${mainLeak}</div>
  </div>

  <div class="locked-box">
    <div class="locked-title">3 more critical leaks — locked</div>
    ${lockedHTML}
  </div>

  <div class="fix-label">✓ Quick fix (free)</div>
  <div class="fix-box">
    <div class="fix-text">${quickFix}</div>
  </div>

  <div class="expiry-text">⏳ This analysis expires in 48 hours as your store data changes.</div>

  <div class="cta-section">
    <div id="ctaBtnTop" class="cta-btn">Unlock All 4 Fixes — $399</div>
    <div class="cta-trust">One-time payment &nbsp;·&nbsp; Delivered in 24h &nbsp;·&nbsp; 4 execution-ready fixes</div>
    <div class="cta-trust-green">✔ Most stores recover this cost from one fix</div>
    <div class="cta-trust" style="margin-top:6px;">🔒 Secure checkout powered by Stripe</div>
  </div>

  <div class="what-box">
    <div class="what-title">Full audit reveals:</div>
    <div class="what-item">→ Exact drop-off points killing your conversions</div>
    <div class="what-item">→ Hidden friction across your entire funnel</div>
    <div class="what-item">→ Revenue impact in real $ per issue</div>
    <div class="what-item">→ Step-by-step fixes — no guessing, no calls</div>
  </div>

  <div class="decision-box">
    <strong style="color:#888;">Your decision:</strong><br><br>
    1) Fix it now → recover $${lossMin.toLocaleString()}/month starting this week<br>
    2) Ignore it → continue losing $${daily.toLocaleString()} every day
  </div>

  <div id="ctaBtnBottom" class="cta-btn-secondary">Unlock All 4 Fixes — $399</div>
  <div class="cta-trust" style="text-align:center;margin-bottom:32px;">
    🔒 Secure checkout &nbsp;·&nbsp; One-time $399 &nbsp;·&nbsp; 24h delivery
  </div>

  <div class="footer">
    Based on direct AI scan of your store &nbsp;·&nbsp; atomfoundry.dev<br>
    Find → Prove → Fix → Protect
  </div>
`;

setTimeout(() => {
  const croBar = document.getElementById("croBar");
  const arsBar = document.getElementById("arsBar");
  if (croBar) croBar.style.width = croScore + "%";
  if (arsBar) arsBar.style.width = arsScore + "%";
}, 300);

const hourly  = Math.round(daily / 24);
let seconds   = 0;
const counter = document.getElementById("liveCounter");

setInterval(() => {
  seconds++;
  const lost = Math.round((hourly / 3600) * seconds);
  if (counter) {
    counter.innerText = `$${lost.toLocaleString()} lost while you are reading this`;
  }
}, 1000);

async function goCheckout(btn) {
  if (!btn) return;
  btn.innerText = "Redirecting to checkout...";
  btn.style.opacity = "0.75";

  try {
    const res = await fetch(
      "https://n8n-production-43ab.up.railway.app/webhook/create-checkout",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          domain: row.store_domain || "",
          email:  email || ""
        })
      }
    );

    const d = await res.json();

    if (!d.url) {
      alert("Checkout error — please try again.");
      btn.innerText = "Unlock All 4 Fixes — $399";
      btn.style.opacity = "1";
      return;
    }

    window.location.href = d.url;

  } catch(err) {
    console.error(err);
    alert("Something went wrong. Please try again.");
    btn.innerText = "Unlock All 4 Fixes — $399";
    btn.style.opacity = "1";
  }
}

document.getElementById("ctaBtnTop").addEventListener("click", function() {
  goCheckout(this);
});
document.getElementById("ctaBtnBottom").addEventListener("click", function() {
  goCheckout(this);
});

})();
</script>
</body>
</html>
