<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store Report – Atom Foundry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
      background:#0f172a;
      color:white;
    }

    .container {
      max-width:640px;
      width:100%;
      margin:0 auto;
      padding:40px 16px;
      text-align:center;
    }

    h1 {
      font-size:24px;
      margin-bottom:10px;
    }

    .card {
      background:#1e293b;
      padding:16px;
      border-radius:14px;
      margin-top:14px;
      border:1px solid #334155;
      text-align:left;
    }

    .red {
      border-color:#ef4444;
      background:#2a1a1a;
    }

    .green {
      border-color:#22c55e;
      background:#162a1f;
    }

    .highlight {
      text-align:center;
    }

    .score {
      font-size:36px;
      font-weight:900;
      margin-top:6px;
    }

    .money {
      font-size:28px;
      font-weight:900;
      color:#ef4444;
      margin-top:6px;
    }

    .cta {
      display:block;
      margin-top:22px;
      padding:18px;
      border-radius:14px;
      background:linear-gradient(135deg,#ff7a18,#ff5a00);
      color:white;
      text-decoration:none;
      font-weight:900;
      text-align:center;
      font-size:16px;
      border:1px solid #ff3b30;
      box-shadow:0 14px 40px rgba(255,90,0,0.35);
    }

    .subtle {
      font-size:12px;
      color:#94a3b8;
      margin-top:10px;
      text-align:center;
    }

    .small {
      font-size:13px;
      color:#cbd5f5;
    }

    .warning {
      color:#f87171;
      font-size:13px;
      margin-top:6px;
    }
  </style>
</head>

<body>

<div class="container">
  <div id="app">Analyzing your store...</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

// 👉 1) zkus query (?id=...)
let id = params.get("id");

// 👉 2) fallback → vezmi z URL (/scan/xxx)
if (!id) {
  const pathParts = window.location.pathname.split("/");
  id = pathParts[pathParts.length - 1];
}

// 👉 ochrana
if (!id || id === "scan") {
  document.getElementById("app").innerText = "Missing scan ID";
  throw new Error("Missing scan ID");
}

const app = document.getElementById("app");

function formatMoney(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

if (!app) {
  console.error("Missing #app element");
} else if (!id) {
  app.innerText = "Missing scan ID";
} else {

  fetch(`/api/get-scan?id=${id}`)
    .then(res => res.json())
    .then(data => {

      if (!data || !data.score) {
        app.innerText = "Report not found";
        return;
      }

      const estimatedLossRaw = Math.round((100 - data.score) * 40);
      const estimatedLoss = formatMoney(estimatedLossRaw);

      app.innerHTML = `
        <h1>Your store is leaking revenue</h1>

        <div class="card red highlight">
          <div class="small">Estimated revenue loss</div>
          <div class="money">$${estimatedLoss}+ / month</div>
          <div class="warning">This is happening right now</div>
        </div>

        <div class="card highlight">
          <div class="small">Conversion Score</div>
          <div class="score">${data.score}/100</div>
          <div class="warning">Below high-performing stores (85+)</div>
        </div>

        <div class="card red">
          <strong>Main conversion leak:</strong><br><br>
          ${data.main_leak_1 || "Users are confused and leave without taking action."}
        </div>

        <div class="card green">
          <strong>Quick fix (you can test today):</strong><br><br>
          ${data.quick_fix_1 || "Add a clear CTA above the fold."}
        </div>

        <div class="card">
          <strong>More issues detected:</strong><br><br>
          → Conversion blockers across your funnel<br>
          → Trust & UX gaps reducing sales<br>
          → Missed revenue opportunities<br><br>
          <span class="warning">Full analysis hidden</span>
        </div>

        <a href="https://buy.stripe.com/test_8x2bJ1ceBaYK6qd94yfUQ03" class="cta">
          Unlock Full Conversion Audit → $399
        </a>

        <div class="subtle">
          Full breakdown of all revenue leaks + exact fixes
        </div>

        <div class="subtle" style="margin-top:12px;">
          ⚡ Generated instantly • No calls • No fluff
        </div>
      `;
    })
    .catch((err) => {
      console.error(err);
      app.innerText = "Error loading report";
    });
}
</script>

</body>
</html>
