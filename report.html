<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  
  <meta charset="UTF-8">
  <title>Store Report – Atom Foundry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
      background:#0A0A0A;
      color:white;
      -webkit-font-smoothing:antialiased;
      padding:16px;
      line-height:1.7;
    }

    .container {
      max-width:560px;
      width:100%;
      margin:0 auto;
      text-align:center;
    }

    /* 🔥 PREMIUM BACKGROUND */
    .container::before {
      content:"";
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:radial-gradient(circle at 50% -20%, rgba(249,115,22,0.15), transparent 40%);
      pointer-events:none;
      z-index:0;
    }

    h1 {
      font-size:24px;
      margin-bottom:10px;
      line-height:1.3;
    }

    .card {
      background:#111;
      padding:18px;
      border-radius:16px;
      margin-top:14px;
      border:1px solid #222;
      text-align:left;
      box-shadow:0 8px 24px rgba(0,0,0,0.6);
      position:relative;
      z-index:1;
      transition:all 0.3s ease;
    }

    .card:hover {
      transform:translateY(-2px);
      box-shadow:0 12px 30px rgba(0,0,0,0.8);
    }

    .red {
      border-color:#dc2626;
      background:linear-gradient(180deg,#1a0f0f,#0f0a0a);
      box-shadow:0 0 0 1px rgba(220,38,38,0.4);
    }

    .green {
      border-color:#14532d;
      background:#052e16;
    }

    .highlight {
      text-align:center;
    }

    .score {
      font-size:48px;
      font-weight:900;
      margin-top:6px;
    }

    .money {
      font-size:36px;
      font-weight:900;
      color:#ef4444;
      margin-top:6px;
      text-shadow:0 0 20px rgba(239,68,68,0.3);
    }

    .cta-zone {
      margin-top:20px;
      padding:18px;
      border-radius:16px;
      background:linear-gradient(180deg,rgba(249,115,22,0.08),rgba(0,0,0,0));
      border:1px solid rgba(249,115,22,0.3);
      box-shadow:0 0 30px rgba(249,115,22,0.1);
    }

    .cta {
      display:block;
      margin-top:0;
      padding:20px;
      border-radius:14px;
      background:linear-gradient(135deg,#f97316,#ea580c);
      color:black;
      text-decoration:none;
      font-weight:900;
      text-align:center;
      font-size:18px;
      border:2px solid #dc2626;
      box-shadow:0 10px 25px rgba(249,115,22,0.4);
      transition:all 0.25s ease;
      cursor:pointer;
    }

    .cta:hover {
      transform:translateY(-3px);
      box-shadow:0 15px 35px rgba(249,115,22,0.6);
    }

    .cta:active {
      transform:scale(0.97);
    }

    .subtle {
      font-size:12px;
      color:#94a3b8;
      margin-top:10px;
      text-align:center;
    }

    .small {
      font-size:13px;
      color:#cbd5f5;
    }

    .warning {
      color:#f87171;
      font-size:13px;
      margin-top:6px;
    }

    @media print {
      body {
        background:white;
        color:black;
      }

      .card {
        page-break-inside:avoid;
        box-shadow:none;
        border:1px solid #ddd;
      }

      .cta {
        display:none;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div id="app">Analyzing your store...</div>
</div>

<script>
const app = document.getElementById("app");

const params = new URLSearchParams(window.location.search);
let id = params.get("id");

if (!id) {
  const parts = window.location.pathname.split("/");
  id = parts[parts.length - 1];
}

if (!id || id === "scan") {
  app.innerText = "Missing scan ID";
  throw new Error("Missing scan ID");
}

function formatMoney(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

fetch(`/api/get-scan?id=${id}`)
  .then(res => res.json())
  .then(data => {

    const row = Array.isArray(data) ? data[0] : data;

    if (!row || row.score === undefined) {
      app.innerText = "Report not found";
      return;
    }

    const estimatedLossRaw = Math.round((100 - row.score) * 40);
    const estimatedLoss = formatMoney(estimatedLossRaw);

    app.innerHTML = `
      <h1>Your store is leaking revenue</h1>

      <div class="card red highlight">
        <div class="small">Estimated revenue loss</div>
        <div class="money">$${estimatedLoss}+ / month</div>
        <div class="warning">This is happening right now</div>
        <div class="warning">+$${Math.round(estimatedLossRaw/30/24)} lost every hour</div>
      </div>

      <div class="card highlight">
        <div class="small">Conversion Score</div>
        <div class="score">${row.score}/100</div>
        <div class="warning">Below high-performing stores (85+)</div>
      </div>

      <div class="card">
        <strong>How this analysis works:</strong><br><br>
        → Based on 1,000+ ecommerce stores<br>
        → Real conversion behavior patterns<br>
        → Revenue-driven signals<br><br>
        <span class="small">This is not a generic AI scan</span>
      </div>

      <div class="card">
        <strong>What we see in similar stores:</strong><br><br>
        → 73% weak first impression<br>
        → 61% lose users in 5 seconds<br>
        → 58% fail to trigger action<br><br>
        <span class="warning">Your store shows the same pattern</span>
      </div>

      <div class="card red">
        <strong>Main conversion leak:</strong><br><br>
        ${row.report_json?.main_leak || "Users are confused and leave without taking action."}
      </div>

      <div class="card green">
        <strong>Quick fix (you can test today):</strong><br><br>
        ${row.report_json?.quick_fix || "Add a clear CTA above the fold."}
      </div>

      <div class="card red">
        <strong>Example hidden issue:</strong><br><br>
        <div style="opacity:0.6;">
          Users hesitate before buying due to missing trust signals...
        </div>
        <div style="margin-top:10px;font-weight:700;color:#f87171;">
          🔒 Full fix hidden
        </div>
      </div>

      <div class="card">
        <strong>Analysis completeness:</strong>
        <div style="margin-top:10px;background:#1e293b;border-radius:10px;">
          <div style="width:32%;background:#f97316;height:10px;border-radius:10px;"></div>
        </div>
        <div class="small">32% visible • 68% locked</div>
      </div>

      <div class="card">
        <strong>Full audit reveals:</strong><br><br>
        → Conversion gap analysis<br>
        → Revenue timeline<br>
        → All hidden leaks<br>
        → Step-by-step plan<br>
        → Prioritized fixes<br><br>
        <span class="warning">⚠️ Not included in free scan</span>
      </div>

      <div class="card">
        <strong>What this means:</strong><br><br>
        Most stores lose $2,000–$10,000/month<br><br>
        Audit cost: $399 one-time<br><br>
        <span class="warning">Fixing one issue can recover this</span>
      </div>

      <div class="small" style="text-align:center;">
        ≈ $13/day for 30 days of insights
      </div>

      <div class="card red">
        <strong>If you do nothing:</strong><br><br>
        → ~$${Math.round(estimatedLossRaw/30)} / day lost<br>
        → ~$${estimatedLoss} / month lost<br><br>
        <div class="green" style="padding:10px;border-radius:10px;">
          One-time $399 → fix leaks
        </div>
      </div>

      <div class="card green">
        <strong>No fluff. No theory.</strong><br><br>
        → Actionable fixes<br>
        → Revenue-focused<br>
        → Immediate implementation<br>
      </div>

      <div class="card">
        <strong>Serious stores fix this early</strong><br><br>
        → Identify leaks fast<br>
        → Act immediately<br>
        → Optimize continuously
      </div>

      <div class="cta-zone">
        <a id="auditBtn" class="cta">
          Find What’s Killing Your Conversions → $399
        </a>

        <div class="subtle">
          Most stores recover the cost from one fix
        </div>

        <div class="subtle">
          ⚡ Instant access • No calls • No commitment
        </div>
      </div>
    `;

const email = row?.email || "";

if (!email) {
  console.error("❌ Missing email");
} else {
  const stripeUrl = "https://buy.stripe.com/test_eVq7sLceB5Eq8ylfsWfUQ05";

  const url =
    stripeUrl +
    "?prefilled_email=" + encodeURIComponent(email);

  const btn = document.getElementById("auditBtn");

  if (btn) {
    btn.href = url;
  }

  console.log("✅ CTA URL:", url);
}

  })
  .catch((err) => {
    console.error(err);
    app.innerText = "Error loading report";
  });
</script>

</body>
</html>
