<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<title>Store Report – Atom Foundry</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto;
  background: #0A0A0A;
  color: white;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: radial-gradient(circle at 50% -10%, rgba(249,115,22,0.12), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 28px 20px 48px;
  position: relative;
  z-index: 1;
}

.domain-label { font-size: 14px; color: #aaa; margin-bottom: 8px; font-weight: 500; }

.loss-number {
  font-size: 64px; font-weight: 800; color: #E24B4A;
  line-height: 1; margin-bottom: 4px;
  text-shadow: 0 0 40px rgba(226,75,74,0.3);
  letter-spacing: -0.02em;
}

.loss-label { font-size: 14px; color: #aaa; margin-bottom: 16px; }
.daily-loss { font-size: 18px; color: #EF9F27; font-weight: 600; margin-bottom: 6px; }
.live-counter { font-size: 14px; color: #888; margin-bottom: 24px; min-height: 22px; }

.scores-section {
  background: #111; border: 1px solid #1e1e1e;
  border-radius: 16px; padding: 18px 20px; margin-bottom: 8px;
}
.score-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
.score-label {
  font-size: 12px; color: #aaa; text-transform: uppercase;
  letter-spacing: 0.06em; font-weight: 600; min-width: 110px;
}
.score-num { font-size: 22px; font-weight: 700; min-width: 65px; line-height: 1; }
.score-bar-wrap { flex: 1; height: 7px; background: #1e1e1e; border-radius: 999px; overflow: hidden; }
.score-bar-fill { height: 100%; border-radius: 999px; transition: width 1s ease; }

.ars-verdict { font-size: 12px; font-weight: 600; margin-bottom: 6px; padding-left: 124px; line-height: 1.4; }
.cro-verdict { font-size: 12px; font-weight: 600; margin-bottom: 10px; padding-left: 124px; line-height: 1.4; }

.ars-detail-link {
  font-size: 13px; color: #f97316; cursor: pointer;
  padding-left: 124px; margin-bottom: 14px; display: block;
  text-decoration: none; letter-spacing: 0.01em; font-weight: 500;
}
.ars-detail-link:hover { color: #fb923c; }

.ars-popup {
  display: none; background: #0d0d0d; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 18px 20px; margin-bottom: 12px;
}
.ars-popup.open { display: block; }
.ars-popup-title { font-size: 14px; font-weight: 700; color: #ddd; margin-bottom: 8px; }
.ars-popup-desc { font-size: 13px; color: #999; line-height: 1.6; margin-bottom: 16px; }
.ars-factor {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px solid #141414;
}
.ars-factor:last-of-type { border-bottom: none; padding-bottom: 0; }
.ars-factor-left { flex: 1; }
.ars-factor-name { font-size: 13px; color: #aaa; margin-bottom: 4px; }
.ars-factor-bar { height: 4px; background: #1a1a1a; border-radius: 999px; overflow: hidden; }
.ars-factor-fill { height: 100%; background: #f97316; border-radius: 999px; }
.ars-factor-weight { font-size: 13px; font-weight: 700; color: #f97316; min-width: 36px; text-align: right; }
.ars-popup-footer { font-size: 12px; color: #666; margin-top: 12px; line-height: 1.6; }

.explain-toggle {
  font-size: 13px; color: #f97316; cursor: pointer;
  text-align: center; padding: 10px; margin-bottom: 16px;
  user-select: none; letter-spacing: 0.02em;
}
.explain-toggle:hover { color: #fb923c; }
.explain-box {
  display: none; background: #0d0d0d; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 16px 18px; margin-bottom: 20px;
  font-size: 13px; color: #aaa; line-height: 1.8;
}
.explain-box.open { display: block; }
.explain-title { font-size: 14px; font-weight: 700; color: #ddd; margin-bottom: 12px; }
.explain-item { margin-bottom: 10px; padding-left: 4px; }
.explain-item:last-child { margin-bottom: 0; }
.explain-highlight { color: #f97316; font-weight: 600; }

.section-label {
  font-size: 11px; color: #888; text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600; margin-bottom: 8px;
}

.main-leak-box {
  background: #111; border: 1px solid #1e1e1e;
  border-left: 3px solid #E24B4A; border-radius: 12px;
  padding: 16px 18px; margin-bottom: 20px;
}
.main-leak-text { font-size: 16px; color: #e8e8e8; font-weight: 500; line-height: 1.6; }

.locked-box {
  background: #0d0d0d; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 16px 18px; margin-bottom: 20px;
}
.locked-title {
  font-size: 11px; color: #888; text-transform: uppercase;
  letter-spacing: 0.07em; margin-bottom: 12px; font-weight: 600;
}
.locked-item {
  font-size: 14px; color: #aaa; margin-bottom: 10px;
  line-height: 1.5; display: flex; align-items: flex-start; gap: 8px;
}
.locked-item:last-child { margin-bottom: 0; }
.locked-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.locked-text { flex: 1; }

.fix-label {
  font-size: 11px; color: #1D9E75; text-transform: uppercase;
  letter-spacing: 0.08em; font-weight: 600; margin-bottom: 8px;
}
.fix-box {
  background: #0a1a0a; border: 1px solid #1a2e1a;
  border-left: 3px solid #1D9E75; border-radius: 12px;
  padding: 16px 18px; margin-bottom: 20px;
}
.fix-text { font-size: 15px; color: #4ade80; line-height: 1.6; }
.fix-impact {
  font-size: 14px; color: #1D9E75; font-weight: 600;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid #1a2e1a;
}

.expiry-text {
  font-size: 14px; color: #888;
  text-align: center; margin-bottom: 16px; line-height: 1.5;
}

.cta-section { margin-bottom: 24px; }
.cta-btn {
  display: block; width: 100%; padding: 20px; border-radius: 14px;
  border: 2px solid #dc2626; background: linear-gradient(135deg, #f97316, #ea580c);
  color: black; font-weight: 900; font-size: 17px; text-align: center;
  cursor: pointer; text-decoration: none;
  box-shadow: 0 12px 30px rgba(249,115,22,0.4);
  transition: all 0.25s ease; animation: ctaPulse 2.5s infinite; margin-bottom: 14px;
}
.cta-btn:hover { transform: translateY(-2px); box-shadow: 0 18px 40px rgba(249,115,22,0.65); }
.cta-btn:active { transform: scale(0.97); }

@keyframes ctaPulse {
  0%   { box-shadow: 0 0 0 rgba(249,115,22,0.4); }
  50%  { box-shadow: 0 0 30px rgba(249,115,22,0.6); }
  100% { box-shadow: 0 0 0 rgba(249,115,22,0.4); }
}

.cta-trust {
  font-size: 14px; color: #999;
  text-align: center; line-height: 1.8; white-space: nowrap;
}
.cta-trust-green { font-size: 14px; color: #1D9E75; text-align: center; margin-top: 5px; }

.founder-box {
  background: #0d0d0d;
  border: 1px solid #1e1e1e;
  border-left: 3px solid #f97316;
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 24px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.founder-avatar {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, #f97316, #ea580c);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: black;
  flex-shrink: 0;
}
.founder-text { flex: 1; }
.founder-name { font-size: 13px; font-weight: 700; color: #e8e8e8; margin-bottom: 4px; }
.founder-sub { font-size: 11px; color: #666; margin-bottom: 8px; }
.founder-quote { font-size: 13px; color: #aaa; line-height: 1.7; font-style: italic; }

.what-box {
  background: #111; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;
}
.what-title { font-size: 14px; font-weight: 700; color: #ddd; margin-bottom: 14px; }
.what-item { font-size: 14px; color: #aaa; margin-bottom: 9px; padding-left: 4px; line-height: 1.5; }
.what-item:last-child { margin-bottom: 0; }

.decision-box {
  background: #0d0d0d; border: 1px solid #1e1e1e;
  border-radius: 12px; padding: 18px 20px; margin-bottom: 24px;
  font-size: 14px; color: #ccc; line-height: 1.9;
}

.cta-btn-secondary {
  display: block; width: 100%; padding: 18px; border-radius: 14px;
  border: 2px solid #dc2626; background: linear-gradient(135deg, #f97316, #ea580c);
  color: black; font-weight: 900; font-size: 17px; text-align: center;
  cursor: pointer; text-decoration: none;
  box-shadow: 0 10px 25px rgba(249,115,22,0.35);
  transition: all 0.25s ease; margin-bottom: 14px;
}
.cta-btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 16px 35px rgba(249,115,22,0.6); }

.footer {
  padding-top: 20px; border-top: 1px solid #1e1e1e;
  text-align: center; margin-top: 8px;
}
.footer-scan-line {
  font-size: 13px; color: #777;
  margin-bottom: 10px; line-height: 1.8; white-space: nowrap;
}
.footer-tagline { font-size: 16px; font-weight: 700; color: #f97316; letter-spacing: 0.04em; }

#loadingState { text-align: center; padding: 60px 20px; font-size: 15px; color: #666; }

@media (max-width: 480px) {
  .loss-number    { font-size: 52px; }
  .daily-loss     { font-size: 17px; }
  .main-leak-text { font-size: 16px; }
  .fix-text       { font-size: 15px; }
  .locked-item    { font-size: 14px; }
  .what-item      { font-size: 14px; }
  .decision-box   { font-size: 14px; }
  .score-label    { min-width: 90px; font-size: 11px; }
  .score-num      { font-size: 20px; min-width: 55px; }
  .ars-verdict    { padding-left: 100px; }
  .cro-verdict    { padding-left: 100px; }
  .ars-detail-link { padding-left: 100px; font-size: 13px; }
  .cta-btn        { font-size: 15px; padding: 18px; }
  .cta-trust      { white-space: normal; font-size: 13px; }
  .footer-scan-line { white-space: normal; font-size: 13px; }
  .footer-tagline { font-size: 15px; }
}
</style>
</head>

<body>
<div class="container">
  <div id="loadingState">Analyzing your store...</div>
  <div id="app" style="display:none;"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
let id = params.get("token");
if (!id) { const parts = window.location.pathname.split("/"); id = parts[parts.length - 1]; }
if (!id || id === "scan" || id === "report") {
  document.getElementById("loadingState").innerText = "Missing scan token.";
  throw new Error("Missing token");
}

function track(event) {
  fetch("https://n8n-production-43ab.up.railway.app/webhook/track", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ token: id, event })
  }).catch(() => {});
}

(async function() {

let data = null;
try {
  const res = await fetch(`/api/get-scan?id=${id}`);
  const raw = await res.json();
  data = Array.isArray(raw) ? raw[0] : raw;
} catch(e) { console.error("API failed", e); }

if (!data) {
  document.getElementById("loadingState").innerText = "Failed to load report. Please try again.";
  return;
}

track("viewed_report");

const row    = data;
const report = row.report_json || {};

const domain = (row.store_domain || "").replace("https://","").replace("http://","").trim();
const displayDomain = (domain && domain !== "undefined" && domain !== "null") ? domain : "Your store";

const lossMin = report.estimated_loss_min || row.estimated_loss_min || 0;
const daily   = report.estimated_loss_daily || Math.round(lossMin / 30);
const lossDisplay = report.estimated_loss_display || ("$" + lossMin.toLocaleString("en-US") + "/month");

const croScore = row.cro_score || row.score || 60;
const arsScore = row.ars_score || report.ars_score || Math.round(croScore * 0.65);

const mainLeak = report.main_leak || "Buyers are dropping off before taking action.";
const quickFix = report.quick_fix || "Make the primary action visually dominant and reduce competing elements.";

const lockedLeaks = Array.isArray(report.locked_leaks) && report.locked_leaks.length > 0
  ? report.locked_leaks
  : [
      { title: "Buyers can't find products fast enough — revenue leaking at every scroll", est_impact: "$" + Math.round(lossMin * 0.25).toLocaleString("en-US") + "/month" },
      { title: "No urgency — users hesitate, delay purchase and don't return",              est_impact: "$" + Math.round(lossMin * 0.20).toLocaleString("en-US") + "/month" },
      { title: "Trust drops before checkout — buyers abandon at the last step",             est_impact: "costing you sales every day" }
    ];

const email = row.email || "";

const getCroColor = (s) => s >= 90 ? "#1D9E75" : s >= 60 ? "#EF9F27" : "#E24B4A";
const getArsColor = (s) => s >= 90 ? "#1D9E75" : s >= 50 ? "#EF9F27" : "#E24B4A";
const croColor = getCroColor(croScore);
const arsColor = getArsColor(arsScore);

const croVerdictText = croScore >= 90
  ? `<span style="color:#1D9E75;">✓ Strong conversion health — maintain and monitor</span>`
  : croScore >= 60
  ? `<span style="color:#EF9F27;">⚠ You're leaving money on the table — competitors scoring 90+ are winning your customers</span>`
  : `<span style="color:#E24B4A;">✗ Buyers are leaving before purchasing — revenue leaking at every step</span>`;

const arsVerdictText = arsScore >= 90
  ? `<span style="color:#1D9E75;">✓ Fully visible to AI agents — strong discovery position</span>`
  : arsScore >= 50
  ? `<span style="color:#EF9F27;">⚠ You're partially visible to AI — competitors may outrank you in AI search</span>`
  : `<span style="color:#E24B4A;">✗ AI agents cannot find or recommend your store — lost traffic every day</span>`;

const quickFixImpact = Math.round(lossMin * 0.3).toLocaleString("en-US");

const lockedHTML = lockedLeaks.map(l => `
  <div class="locked-item">
    <span class="locked-icon">🔒</span>
    <span class="locked-text">${l.title}${l.est_impact
      ? ' <span style="color:#777;">· ' + l.est_impact + '</span>' : ''}</span>
  </div>`).join("");

document.getElementById("loadingState").style.display = "none";
const app = document.getElementById("app");
app.style.display = "block";

app.innerHTML = `

  <div class="domain-label">${displayDomain}</div>
  <div class="loss-number">${lossDisplay}</div>

  <!-- 🔥 consequence language -->
  <div class="loss-label">revenue leaking from your store every month</div>

  <div class="daily-loss">⚡ That's $${daily.toLocaleString("en-US")} in lost sales every single day.</div>
  <div class="live-counter" id="liveCounter"></div>

  <div class="scores-section">
    <div class="score-row">
      <div class="score-label">CRO Score</div>
      <div class="score-num" style="color:${croColor};">${croScore}<span style="font-size:13px;color:#888;">/100</span></div>
      <div class="score-bar-wrap">
        <div class="score-bar-fill" id="croBar" style="width:0%;background:${croColor};"></div>
      </div>
    </div>
    <div class="cro-verdict">${croVerdictText}</div>

    <div class="score-row">
      <div class="score-label">AI Readiness</div>
      <div class="score-num" style="color:${arsColor};">${arsScore}<span style="font-size:13px;color:#888;">/100</span></div>
      <div class="score-bar-wrap">
        <div class="score-bar-fill" id="arsBar" style="width:0%;background:${arsColor};"></div>
      </div>
    </div>
    <div class="ars-verdict">${arsVerdictText}</div>
    <span class="ars-detail-link" onclick="toggleArsPopup()">▸ Why AI agents might skip your store</span>

    <div class="ars-popup" id="arsPopup">
      <div class="ars-popup-title">How AI Readiness is calculated</div>
      <div class="ars-popup-desc">
        AI shopping agents (Google SGE, ChatGPT Shopping, Perplexity) score your store
        across 6 factors. Low scores mean agents skip your store when recommending products to buyers.
      </div>
      <div class="ars-factor">
        <div class="ars-factor-left">
          <div class="ars-factor-name">Structured Data (Schema)</div>
          <div class="ars-factor-bar"><div class="ars-factor-fill" style="width:25%;"></div></div>
        </div>
        <div class="ars-factor-weight">25%</div>
      </div>
      <div class="ars-factor">
        <div class="ars-factor-left">
          <div class="ars-factor-name">Content Quality & Specificity</div>
          <div class="ars-factor-bar"><div class="ars-factor-fill" style="width:20%;"></div></div>
        </div>
        <div class="ars-factor-weight">20%</div>
      </div>
      <div class="ars-factor">
        <div class="ars-factor-left">
          <div class="ars-factor-name">Trust Signals</div>
          <div class="ars-factor-bar"><div class="ars-factor-fill" style="width:20%;"></div></div>
        </div>
        <div class="ars-factor-weight">20%</div>
      </div>
      <div class="ars-factor">
        <div class="ars-factor-left">
          <div class="ars-factor-name">Technical Readability</div>
          <div class="ars-factor-bar"><div class="ars-factor-fill" style="width:15%;"></div></div>
        </div>
        <div class="ars-factor-weight">15%</div>
      </div>
      <div class="ars-factor">
        <div class="ars-factor-left">
          <div class="ars-factor-name">Price Visibility</div>
          <div class="ars-factor-bar"><div class="ars-factor-fill" style="width:12%;"></div></div>
        </div>
        <div class="ars-factor-weight">12%</div>
      </div>
      <div class="ars-factor">
        <div class="ars-factor-left">
          <div class="ars-factor-name">Brand Entity Clarity</div>
          <div class="ars-factor-bar"><div class="ars-factor-fill" style="width:8%;"></div></div>
        </div>
        <div class="ars-factor-weight">8%</div>
      </div>
      <div class="ars-popup-footer">
        The full audit includes specific fixes for each factor — structured data implementation,
        content improvements, and technical optimizations.
      </div>
    </div>
  </div>

  <div class="explain-toggle" onclick="toggleExplain()">▸ What do these scores mean?</div>

  <div class="explain-box" id="explainBox">
    <div class="explain-title">Understanding your two scores</div>
    <div class="explain-item">
      <span class="explain-highlight">CRO Score (Conversion Rate Optimization)</span><br>
      Measures how many visitors are dropping off before buying. Top stores score 90+.
      Every point below 90 is revenue leaking through gaps your traffic is already paying for.
    </div>
    <div class="explain-item">
      <span class="explain-highlight">AI Readiness Score</span><br>
      Measures whether AI shopping agents — Google SGE, ChatGPT Shopping, Perplexity — can find
      and recommend your store. Low score means buyers who ask AI "what's the best X?" 
      never see you. That's lost sales before they even land on your page.
    </div>
    <div class="explain-item">
      <span class="explain-highlight">Why both matter</span><br>
      CRO stops revenue leaking from existing traffic.
      AI Readiness recovers sales from traffic you're not getting yet.
      Both are costing you money right now.
    </div>
  </div>

  <!-- 🔥 consequence language -->
  <div class="section-label">Where buyers are dropping off</div>
  <div class="main-leak-box">
    <div class="main-leak-text">${mainLeak}</div>
  </div>

  <!-- 🔥 consequence language -->
  <div class="locked-box">
    <div class="locked-title">3 more revenue leaks costing you money — locked</div>
    ${lockedHTML}
  </div>

  <!-- 🔥 consequence language -->
  <div class="fix-label">✓ Stop this leak now — free</div>
  <div class="fix-box">
    <div class="fix-text">${quickFix}</div>
    <div class="fix-impact">→ Stops $${quickFixImpact}/month in lost revenue</div>
  </div>

  <!-- 🔥 consequence language -->
  <div class="expiry-text">⏳ This report expires in 48 hours — your revenue leak is active right now.</div>

  <div class="cta-section">
    <div id="ctaBtnTop" class="cta-btn">
      Recover $${lossMin.toLocaleString("en-US")}/mo — Unlock All 4 Fixes ($399)
    </div>
    <div class="cta-trust">One-time payment &nbsp;·&nbsp; Delivered in 24h &nbsp;·&nbsp; 4 execution-ready fixes</div>
    <div class="cta-trust-green">✔ Most stores recover this cost in the first week</div>
    <div class="cta-trust" style="margin-top:5px;">🔒 Secure checkout powered by Stripe</div>
  </div>

  <!-- 🔥 consequence language -->
  <div class="what-box">
    <div class="what-title">Unlock all 4 revenue leaks — see exactly what's costing you:</div>
    <div class="what-item">→ Exact drop-off points where buyers are leaving</div>
    <div class="what-item">→ Hidden revenue leaks across your entire funnel</div>
    <div class="what-item">→ Real $ cost per leak — evidence not estimates</div>
    <div class="what-item">→ Step-by-step fix for each leak — no guessing, no calls</div>
  </div>

  <!-- 🔥 consequence language -->
  <div class="decision-box">
    <strong style="color:#fff;">Your decision right now:</strong><br><br>
    1) Stop the leak → recover $${lossMin.toLocaleString("en-US")}/month starting this week<br>
    2) Do nothing → continue losing $${daily.toLocaleString("en-US")} in sales every single day
  </div>

  <div class="founder-box">
    <div class="founder-avatar">D</div>
    <div class="founder-text">
      <div class="founder-name">Daniel — Founder, Atom Foundry</div>
      <div class="founder-sub">Scanning DTC stores daily · atomfoundry.dev</div>
      <div class="founder-quote">
        "I've seen hundreds of stores fail because of these 4 leaks.<br>
        I won't let yours be one of them."
      </div
    </div>
  </div>

  <div id="ctaBtnBottom" class="cta-btn-secondary">
    Recover $${lossMin.toLocaleString("en-US")}/mo — Unlock All 4 Fixes ($399)
  </div>
  <div class="cta-trust" style="text-align:center;margin-bottom:32px;">
    🔒 Secure checkout &nbsp;·&nbsp; One-time $399 &nbsp;·&nbsp; 24h delivery
  </div>

  <div class="footer">
    <div class="footer-scan-line">
      Based on direct revenue leak scan of your store &nbsp;·&nbsp; atomfoundry.dev
    </div>
    <div class="footer-tagline">Find → Prove → Fix → Protect</div>
  </div>
`;

setTimeout(() => {
  const croBar = document.getElementById("croBar");
  const arsBar = document.getElementById("arsBar");
  if (croBar) croBar.style.width = croScore + "%";
  if (arsBar) arsBar.style.width = arsScore + "%";
}, 300);

const hourly  = Math.round(daily / 24);
let seconds   = 0;
const counter = document.getElementById("liveCounter");
setInterval(() => {
  seconds++;
  const lost = Math.round((hourly / 3600) * seconds);
  if (counter) counter.innerText = `$${lost.toLocaleString("en-US")} in lost sales while you are reading this`;
}, 1000);

async function goCheckout(btn) {
  if (!btn) return;
  track("clicked_cta");
  const originalText = btn.innerText;
  btn.innerText = "Redirecting to checkout...";
  btn.style.opacity = "0.75";
  try {
    const res = await fetch(
      "https://n8n-production-43ab.up.railway.app/webhook/create-checkout",
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domain: row.store_domain || "", email: email || "" })
      }
    );
    const d = await res.json();
    if (!d.url) {
      alert("Checkout error — please try again.");
      btn.innerText = originalText;
      btn.style.opacity = "1";
      return;
    }
    window.location.href = d.url;
  } catch(err) {
    console.error(err);
    alert("Something went wrong. Please try again.");
    btn.innerText = originalText;
    btn.style.opacity = "1";
  }
}

document.getElementById("ctaBtnTop").addEventListener("click", function() { goCheckout(this); });
document.getElementById("ctaBtnBottom").addEventListener("click", function() { goCheckout(this); });

})();

function toggleExplain() {
  const box    = document.getElementById("explainBox");
  const toggle = document.querySelector(".explain-toggle");
  if (!box) return;
  const isOpen = box.classList.contains("open");
  box.classList.toggle("open");
  toggle.innerText = isOpen ? "▸ What do these scores mean?" : "▾ What do these scores mean?";
}

function toggleArsPopup() {
  const popup = document.getElementById("arsPopup");
  const link  = document.querySelector(".ars-detail-link");
  if (!popup) return;
  const isOpen = popup.classList.contains("open");
  popup.classList.toggle("open");
  link.innerText = isOpen ? "▸ Why AI agents might skip your store" : "▾ Why AI agents might skip your store";
}
