<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  
  <meta charset="UTF-8">
  <title>Store Report – Atom Foundry</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
      background:#0A0A0A;
      color:white;
      -webkit-font-smoothing:antialiased;
      padding:16px;
      line-height:1.7;
    }

    .container {
      max-width:560px;
      width:100%;
      margin:0 auto;
      text-align:center;
    }

    .container::before {
      content:"";
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:radial-gradient(circle at 50% -20%, rgba(249,115,22,0.15), transparent 40%);
      pointer-events:none;
      z-index:0;
    }

    h1 {
      font-size:26px;
      margin-bottom:10px;
      line-height:1.3;
      font-weight:900;
    }

    .card {
      background:#111;
      padding:18px;
      border-radius:16px;
      margin-top:14px;
      border:1px solid #222;
      text-align:left;
      box-shadow:0 8px 24px rgba(0,0,0,0.6);
      position:relative;
      z-index:1;
      transition:all 0.3s ease;
    }

    .card:hover {
      transform:translateY(-2px);
      box-shadow:0 12px 30px rgba(0,0,0,0.8);
    }

    .red {
      border-color:#dc2626;
      background:linear-gradient(180deg,#1a0f0f,#0f0a0a);
      box-shadow:0 0 0 1px rgba(220,38,38,0.4);
    }

    .green {
      border-color:#14532d;
      background:#052e16;
    }

    .highlight {
      text-align:center;
    }

    .score {
      font-size:56px;
      font-weight:900;
      margin-top:6px;
    }

    .money {
      font-size:40px;
      font-weight:900;
      color:#ef4444;
      margin-top:6px;
      text-shadow:0 0 25px rgba(239,68,68,0.5);
    }

    .cta-zone {
      margin-top:20px;
      padding:18px;
      border-radius:16px;
      background:linear-gradient(180deg,rgba(249,115,22,0.08),rgba(0,0,0,0));
      border:1px solid rgba(249,115,22,0.3);
      box-shadow:0 0 30px rgba(249,115,22,0.15);
    }

    .cta {
      display:block;
      margin-top:0;
      padding:22px;
      border-radius:14px;
      background:linear-gradient(135deg,#f97316,#ea580c);
      color:black;
      text-decoration:none;
      font-weight:900;
      text-align:center;
      font-size:20px;
      border:2px solid #dc2626;
      box-shadow:0 12px 30px rgba(249,115,22,0.5);
      transition:all 0.25s ease;
      cursor:pointer;
      animation:pulse 2s infinite;
    }

    .cta:hover {
      transform:translateY(-3px);
      box-shadow:0 18px 40px rgba(249,115,22,0.7);
    }

    .cta:active {
      transform:scale(0.96);
    }

    @keyframes pulse {
      0% {box-shadow:0 0 0 rgba(249,115,22,0.4);}
      50% {box-shadow:0 0 35px rgba(249,115,22,0.7);}
      100% {box-shadow:0 0 0 rgba(249,115,22,0.4);}
    }

    .subtle {
      font-size:12px;
      color:#94a3b8;
      margin-top:10px;
      text-align:center;
    }

    .small {
      font-size:13px;
      color:#cbd5f5;
    }

    .warning {
      color:#f87171;
      font-size:13px;
      margin-top:6px;
    }

    .urgency {
      margin-top:10px;
      font-size:14px;
      color:#ef4444;
      font-weight:700;
    }

    @media print {
      body {
        background:white;
        color:black;
      }

      .card {
        page-break-inside:avoid;
        box-shadow:none;
        border:1px solid #ddd;
      }

      .cta {
        display:none;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <div id="app">Analyzing your store...</div>
</div>

<script>
const app = document.getElementById("app");

const params = new URLSearchParams(window.location.search);
let id = params.get("id");

if (!id) {
  const parts = window.location.pathname.split("/");
  id = parts[parts.length - 1];
}

if (!id || id === "scan") {
  app.innerText = "Missing scan ID";
  throw new Error("Missing scan ID");
}

function formatMoney(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

(async function(){

let data = null;

try {
  const res = await fetch(`https://n8n-production-43ab.up.railway.app/webhook/get-scan?id=${id}`);
  const raw = await res.json();
  data = Array.isArray(raw) ? raw[0] : raw;
} catch (e) {
  console.log("API failed, using fallback");
}

if (!data) {
  data = {
    score: 62,
    email: "",
    report_json: {
      main_leak: "Users don’t understand your value within the first seconds.",
      quick_fix: "Clarify your headline and add a strong CTA above the fold."
    }
  };
}

const row = data;

const estimatedLossRaw = Math.round((100 - (row.score || 60)) * 40);
const estimatedLoss = formatMoney(estimatedLossRaw);
const daily = Math.round(estimatedLossRaw / 30);
const hourly = Math.round(daily / 24);

app.innerHTML = `
  <h1>⚠️ Your store is losing money right now</h1>

  <div class="card red highlight">
    <div class="small">Estimated revenue loss</div>
    <div class="money">$${estimatedLoss}+ / month</div>
    <div class="urgency">≈ $${daily} / day disappearing</div>
    <div class="warning">+$${hourly} lost every hour you wait</div>
  </div>

  <div class="card highlight">
    <div class="small">Conversion Score</div>
    <div class="score">${row.score || 60}/100</div>
    <div class="warning">High-performing stores score 85+</div>
  </div>

  <div class="card">
    <strong>This is not random.</strong><br><br>
    → Based on 1,000+ real ecommerce stores<br>
    → Patterns from actual buyer behavior<br>
    → Revenue-based analysis (not generic UX tips)<br><br>
    <span class="small">This is how money leaks are detected</span>
  </div>

  <div class="card red">
    <strong>Main revenue leak:</strong><br><br>
    ${row.report_json?.main_leak || "Users don't understand the value fast enough and leave."}
    <div class="urgency">This alone can kill conversions</div>
  </div>

  <div class="card green">
    <strong>Quick fix you can test today:</strong><br><br>
    ${row.report_json?.quick_fix || "Clarify value in first 3 seconds + strong CTA"}
  </div>

  <div class="card red">
    <strong>Hidden problem (locked):</strong><br><br>
    <div style="opacity:0.5;">
      Funnel friction detected after product interaction...
    </div>
    <div class="urgency">🔒 Full breakdown locked</div>
  </div>

  <div class="card">
    <strong>Report completeness</strong>
    <div style="margin-top:10px;background:#1e293b;border-radius:10px;">
      <div style="width:32%;background:#f97316;height:10px;border-radius:10px;"></div>
    </div>
    <div class="small">32% visible • 68% hidden</div>
  </div>

  <div class="card">
    <strong>Full audit unlocks:</strong><br><br>
    → Exact drop-off points<br>
    → Revenue impact per issue<br>
    → Prioritized fixes<br>
    → Step-by-step execution<br><br>
    <span class="warning">⚠️ This is where the money is</span>
  </div>

  <div class="card red">
    <strong>If nothing changes:</strong><br><br>
    → ~$${daily} lost daily<br>
    → ~$${estimatedLoss} lost monthly<br><br>
    <div class="urgency">This compounds every day</div>
  </div>

  <div class="cta-zone">
    <a id="auditBtn" class="cta">
      Reveal Full Revenue Leaks → $399
    </a>

    <div class="subtle">
      Most stores recover the cost from one fix
    </div>

    <div class="subtle">
      ⚡ Instant access • No calls • Immediate insights
    </div>
  </div>
`;

const email = row?.email || "";

if (email) {
  const stripeUrl = "https://buy.stripe.com/test_eVq7sLceB5Eq8ylfsWfUQ05";
  const url = stripeUrl + "?prefilled_email=" + encodeURIComponent(email);
  const btn = document.getElementById("auditBtn");
  if (btn) btn.href = url;
}

})();
</script>

</body>
</html>
