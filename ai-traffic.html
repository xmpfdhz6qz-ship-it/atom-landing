<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>AI Traffic — Atom Foundry (private)</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --orange:#f97316; --green:#1D9E75; --amber:#EF9F27; --red:#E24B4A; --bg:#080808; --bg2:#111; --border:#1e1e1e; --text:#e8e8e8; --muted:#aaa; --dim:#666; }
body { font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:36px 20px 90px; font-size:16px; }
.wrap { max-width:1060px; margin:0 auto; }
.head { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:6px; }
h1 { font-size:32px; font-weight:800; color:#fff; letter-spacing:-0.02em; }
h1 span { color:var(--orange); }
.priv { font-size:12px; color:var(--dim); border:1px solid var(--border); border-radius:6px; padding:4px 10px; text-transform:uppercase; letter-spacing:0.08em; }
.sub { font-size:15px; color:var(--muted); margin-bottom:6px; }
.sub-cz { font-size:14px; color:var(--dim); margin-bottom:28px; font-style:italic; }
.cards { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:30px; }
.card { background:var(--bg2); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
.card .n { font-size:38px; font-weight:800; color:var(--orange); line-height:1; }
.card .l { font-size:14px; color:var(--muted); margin-top:8px; font-weight:600; }
.card .cz { font-size:12px; color:var(--dim); margin-top:2px; }
.card.warn .n { color:var(--red); }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.panel { background:var(--bg2); border:1px solid var(--border); border-radius:14px; padding:22px 24px; margin-bottom:18px; }
.panel h2 { font-size:15px; color:#fff; margin-bottom:3px; font-weight:700; }
.panel .h2cz { font-size:13px; color:var(--dim); margin-bottom:18px; font-style:italic; }
.panel .note { font-size:11px; color:#555; font-weight:400; font-style:normal; }
.row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:15px; }
.row:last-child { border-bottom:none; }
.row .lbl { flex:1.3; min-width:0; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.row .name { font-weight:600; color:#fff; }
.row .val { font-weight:800; color:#fff; font-variant-numeric:tabular-nums; min-width:38px; text-align:right; font-size:16px; }
.row .seen { font-size:12px; color:#555; white-space:nowrap; }
.bar { height:8px; background:#1a1a1a; border-radius:99px; overflow:hidden; flex:1; min-width:60px; }
.bar > i { display:block; height:100%; background:linear-gradient(90deg,var(--orange),var(--amber)); }
.tag { font-size:11px; padding:3px 8px; border-radius:5px; font-weight:700; white-space:nowrap; }
.t-retrieval { color:var(--green); background:rgba(29,158,117,0.12); }
.t-training { color:var(--orange); background:rgba(249,115,22,0.12); }
.t-search { color:var(--amber); background:rgba(239,159,39,0.12); }
.t-other { color:var(--dim); background:#161616; }
.mono { font-family:ui-monospace,Menlo,monospace; font-size:13px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }
.trend { display:flex; align-items:flex-end; gap:10px; height:120px; margin-top:12px; padding-bottom:26px; }
.trend .col { flex:0 1 90px; max-width:90px; display:flex; flex-direction:column; justify-content:flex-end; height:100%; position:relative; }
.trend .col > b { display:block; background:linear-gradient(180deg,var(--orange),#c2410c); border-radius:4px 4px 0 0; min-height:3px; }
.trend .cnt { font-size:12px; color:#fff; font-weight:700; text-align:center; margin-bottom:4px; }
.trend .d { position:absolute; bottom:-22px; left:0; right:0; text-align:center; font-size:11px; color:var(--dim); }
.legend { font-size:13px; color:var(--dim); margin-top:14px; line-height:1.7; }
.legend b { color:var(--muted); }
.msg { text-align:center; padding:70px 20px; color:var(--muted); font-size:16px; }
.msg h2 { color:#fff; margin-bottom:10px; font-size:20px; }
.refresh { font-size:13px; color:var(--dim); cursor:pointer; border:1px solid var(--border); border-radius:6px; padding:5px 12px; }
.refresh:hover { color:var(--orange); border-color:rgba(249,115,22,0.4); }
.empty { color:#555; font-size:14px; padding:8px 0; }
@media (max-width:820px){ .cards{grid-template-columns:repeat(2,1fr);} .grid2{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>AI <span>Traffic</span></h1>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="priv">Private</span>
      <span class="refresh" id="refresh" title="Obnovit">Refresh</span>
    </div>
  </div>
  <div class="sub">Which AI agents read atomfoundry.dev, what they read, and which stores they pulled.</div>
  <div class="sub-cz">Kteří AI agenti čtou atomfoundry.dev, co čtou a které eshopy si načetli. Měřeno beaconem — zachytí boty, kteří spouští JavaScript.</div>
  <div id="content"><div class="msg">Loading… / Načítám…</div></div>
</div>
<script>
const BASE = "https://n8n-production-1d7c.up.railway.app/webhook";
const params = new URLSearchParams(location.search);
const key = params.get('key') || '';
const content = document.getElementById('content');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => Number(n||0).toLocaleString('en-US');
const typeTag = t => `<span class="tag t-${esc(t||'other')}">${esc(t||'other')}</span>`;
function ago(ts){ if(!ts)return''; const d=(Date.now()-new Date(ts).getTime())/1000; if(d<60)return Math.floor(d)+'s'; if(d<3600)return Math.floor(d/60)+'m'; if(d<86400)return Math.floor(d/3600)+'h'; return Math.floor(d/86400)+'d'; }

function bars(rows, lblFn, max){
  if(!rows||!rows.length) return '<div class="row"><span class="lbl" style="color:#555">No data yet.</span></div>';
  return rows.map(r=>{
    const v=Number(r.visits||0); const w=max?Math.round(100*v/max):0;
    return `<div class="row"><span class="lbl">${lblFn(r)}</span><span class="bar"><i style="width:${w}%"></i></span><span class="val">${fmt(v)}</span></div>`;
  }).join('');
}

function render(d){
  const s=d.summary||{};
  const maxBot=Math.max(1,...(d.by_bot||[]).map(x=>+x.visits));
  const maxPage=Math.max(1,...(d.top_pages||[]).map(x=>+x.visits));
  const maxStore=Math.max(1,...(d.stores||[]).map(x=>+x.visits));
  const maxDay=Math.max(1,...(d.trend||[]).map(x=>+x.visits));
  const typeTotal=(d.by_type||[]).reduce((a,x)=>a+ +x.visits,0)||1;
  const CZ={retrieval:'čte tě, aby odpovědělo uživateli',training:'učí se z tebe (parametrická paměť)',search:'klasické vyhledávání',other:'ostatní'};

  content.innerHTML = `
    <div class="cards">
      <div class="card"><div class="n">${fmt(s.total)}</div><div class="l">Total AI visits</div><div class="cz">Celkem AI návštěv</div></div>
      <div class="card"><div class="n">${fmt(s.today)}</div><div class="l">Today</div><div class="cz">Dnes</div></div>
      <div class="card"><div class="n">${fmt(s.bots)}</div><div class="l">Distinct bots</div><div class="cz">Různých botů</div></div>
      <div class="card"><div class="n">${fmt(s.stores)}</div><div class="l">Stores AI read</div><div class="cz">Eshopů, co AI četla</div></div>
      <div class="card warn"><div class="n">${fmt(s.probes)}</div><div class="l">Spoofed probes</div><div class="cz">Podvržené skeny</div></div>
    </div>

    <div class="panel">
      <h2>Visits per day</h2>
      <div class="h2cz">Návštěvy po dnech</div>
      <div class="trend">${(d.trend||[]).map(t=>{
        const h=Math.round(100*(+t.visits)/maxDay);
        const day=String(t.day||'').slice(5);
        return `<div class="col"><span class="cnt">${fmt(t.visits)}</span><b style="height:${h}%"></b><span class="d">${esc(day)}</span></div>`;
      }).join('')||'<span class="empty">No data yet. / Zatím žádná data.</span>'}</div>
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>Who reads you</h2>
        <div class="h2cz">Kdo tě čte</div>
        ${(d.by_bot||[]).length?(d.by_bot||[]).map(r=>`<div class="row">
          <span class="lbl"><span class="name">${esc(r.bot)}</span>${typeTag(r.bot_type)}<span class="seen">před ${ago(r.last_seen)}</span></span>
          <span class="bar"><i style="width:${Math.round(100*(+r.visits)/maxBot)}%"></i></span>
          <span class="val">${fmt(r.visits)}</span></div>`).join(''):'<div class="empty">No data yet. / Zatím žádná data.</div>'}
      </div>
      <div class="panel">
        <h2>Retrieval vs training</h2>
        <div class="h2cz">Čtení pro odpověď vs. učení</div>
        ${(d.by_type||[]).length?(d.by_type||[]).map(t=>`<div class="row">
          <span class="lbl">${typeTag(t.bot_type)}</span>
          <span class="bar"><i style="width:${Math.round(100*(+t.visits)/typeTotal)}%"></i></span>
          <span class="val">${fmt(t.visits)}</span></div>`).join(''):'<div class="empty">No data yet. / Zatím žádná data.</div>'}
        <div class="legend">
          <b>retrieval</b> — ${CZ.retrieval}<br>
          <b>training</b> — ${CZ.training}<br>
          <b>search</b> — ${CZ.search}
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Stores AI pulled <span class="note">— which merchants AI actually read</span></h2>
      <div class="h2cz">Eshopy, které si AI reálně načetla</div>
      ${(d.stores||[]).length?(d.stores||[]).map(r=>`<div class="row">
        <span class="lbl"><span class="mono">${esc(r.store_domain)}</span><span class="seen">${esc(r.bots)}</span></span>
        <span class="bar"><i style="width:${Math.round(100*(+r.visits)/maxStore)}%"></i></span>
        <span class="val">${fmt(r.visits)}</span></div>`).join(''):'<div class="empty">No data yet — no bot has visited a /store/ page. / Zatím nic — žádný bot nebyl na stránce eshopu.</div>'}
    </div>

    <div class="grid2">
      <div class="panel">
        <h2>Top pages</h2>
        <div class="h2cz">Nejčtenější stránky</div>
        ${(d.top_pages||[]).length?(d.top_pages||[]).map(r=>`<div class="row">
          <span class="lbl"><span class="mono">${esc(r.path)}</span></span>
          <span class="bar"><i style="width:${Math.round(100*(+r.visits)/maxPage)}%"></i></span>
          <span class="val">${fmt(r.visits)}</span></div>`).join(''):'<div class="empty">No data yet. / Zatím žádná data.</div>'}
      </div>
      <div class="panel">
        <h2>Recent activity</h2>
        <div class="h2cz">Poslední aktivita</div>
        ${(d.recent||[]).length?(d.recent||[]).slice(0,15).map(r=>`<div class="row">
          <span class="lbl"><span class="name">${esc(r.bot)}</span>${typeTag(r.bot_type)}<span class="mono">${esc(r.path)}</span></span>
          <span class="seen">před ${ago(r.visited_at)}</span></div>`).join(''):'<div class="empty">No data yet. / Zatím žádná data.</div>'}
      </div>
    </div>

    ${(d.probes_list&&d.probes_list.length)?`<div class="panel" style="border-color:rgba(226,75,74,0.3)">
      <h2 style="color:var(--red)">Spoofed / attack probes <span class="note">— fake AI user-agents scanning for secrets</span></h2>
      <div class="h2cz">Podvržené AI user-agenty, které hledají tajné soubory (na statickém webu neškodné)</div>
      ${d.probes_list.map(r=>`<div class="row">
        <span class="lbl"><span class="name">${esc(r.bot)}</span><span class="mono" style="color:var(--red)">${esc(r.path)}</span></span>
        <span class="seen">před ${ago(r.visited_at)}</span></div>`).join('')}
    </div>`:''}`;
}

async function load(){
  if(!key){ content.innerHTML = `<div class="msg"><h2>Access key required / Chybí přístupový klíč</h2>Add <span class="mono">?key=YOUR_TOKEN</span> to the URL.<br><span style="color:#666">Přidej <span class="mono">?key=TVŮJ_TOKEN</span> do adresy.</span></div>`; return; }
  content.innerHTML = '<div class="msg">Loading… / Načítám…</div>';
  try {
    const res = await fetch(BASE + "/ai-traffic?key=" + encodeURIComponent(key), { headers:{ "Accept":"application/json" } });
    if(res.status === 403){ content.innerHTML = `<div class="msg"><h2>Invalid key / Neplatný klíč</h2>Check the token in your URL. / Zkontroluj token v adrese.</div>`; return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const d = await res.json();
    render(d);
  } catch(e){
    content.innerHTML = `<div class="msg"><h2>Could not load / Nepodařilo se načíst</h2>${esc(e.message||e)}</div>`;
  }
}
document.getElementById('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
