<!DOCTYPE html>
<html>
<head>
  <title>Monitoring</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body style="font-family: Arial; padding: 20px; max-width: 800px; margin: auto;">

  <h1 id="store"></h1>

  <h2 id="score"></h2>
  <p id="status" style="font-weight: bold;"></p>
  <p id="loss"></p>

  <h3>Issues:</h3>
  <ul id="issues"></ul>

  <h3>History:</h3>
  <ul id="history"></ul>

<script>
const url = window.location.pathname.split("/");
const token = url[url.length - 1];

fetch(`https://n8n-production-d989b.up.railway.app/webhook/monitoring?token=${token}`)
  .then(res => res.json())
  .then(data => {

    document.getElementById("store").innerText = data.store;
    document.getElementById("score").innerText = "Score: " + data.score;
    document.getElementById("loss").innerText = "Loss: $" + data.monthly_loss;

    // 🔥 STATUS
    const statusEl = document.getElementById("status");

    if (data.status === "improving") {
      statusEl.innerText = "Status: improving 📈";
      statusEl.style.color = "green";
    } else if (data.status === "declining") {
      statusEl.innerText = "Status: declining 📉";
      statusEl.style.color = "red";
    } else {
      statusEl.innerText = "Status: stable";
      statusEl.style.color = "gray";
    }

    // Issues
    const issues = document.getElementById("issues");
    issues.innerHTML = "";

    data.issues.forEach(i => {
      const li = document.createElement("li");
      li.innerText = i;
      issues.appendChild(li);
    });

    // History
    const history = document.getElementById("history");
    history.innerHTML = "";

    data.history.forEach(h => {
      const li = document.createElement("li");
      li.innerText = new Date(h.created_at).toLocaleDateString() + " → " + h.score;
      history.appendChild(li);
    });

  });
</script>

<!-- SITE_VISIT_TRACKER:START -->
<script>
(function(){
  try {
    if (navigator.doNotTrack === '1' || window.doNotTrack === '1' || navigator.msDoNotTrack === '1') return;
    var VID_KEY = 'af_vid';
    var vid = localStorage.getItem(VID_KEY);
    if (!vid) {
      vid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
      localStorage.setItem(VID_KEY, vid);
    }
    var payload = JSON.stringify({
      visitor_id: vid,
      path: location.pathname,
      referrer: document.referrer || '',
      user_agent: navigator.userAgent || ''
    });
    var url = 'https://n8n-production-1d7c.up.railway.app/webhook/site-visit';
    if (navigator.sendBeacon) {
      navigator.sendBeacon(url, new Blob([payload], { type: 'application/json' }));
    } else {
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: payload, keepalive: true }).catch(function(){});
    }
  } catch (e) {}
})();
</script>
<!-- SITE_VISIT_TRACKER:END -->
<style>
.aiw-root{position:fixed;bottom:22px;right:22px;z-index:2000;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.aiw-fab{position:relative;width:52px;height:52px;border-radius:14px;background:#0b0d0e;border:1px solid #262b2e;display:flex;align-items:center;justify-content:center;color:#5fe0af;cursor:pointer;box-shadow:0 14px 30px -10px rgba(0,0,0,0.45);transition:transform .2s ease,box-shadow .2s ease;padding:0;}
.aiw-fab:hover{transform:translateY(-2px);box-shadow:0 18px 36px -10px rgba(0,0,0,0.5);}
.aiw-heart{width:22px;height:22px;}
.aiw-heart-base{stroke:rgba(95,224,175,0.22);fill:none;}
.aiw-heart-pulse{stroke:#5fe0af;fill:none;stroke-dasharray:10 42;stroke-dashoffset:0;animation:aiwHeartSweep 1.6s linear infinite;filter:drop-shadow(0 0 3px rgba(95,224,175,0.7));}
@keyframes aiwHeartSweep{
  0%{stroke-dashoffset:0;}
  22%{stroke-dashoffset:-4;}
  26%{stroke-dashoffset:-11;}
  29%{stroke-dashoffset:-13;}
  33%{stroke-dashoffset:-26;}
  37%{stroke-dashoffset:-28;}
  41%{stroke-dashoffset:-36;}
  45%{stroke-dashoffset:-39;}
  72%{stroke-dashoffset:-45;}
  100%{stroke-dashoffset:-52;}
}
@media(prefers-reduced-motion:reduce){.aiw-heart-pulse,.aiw-panel-dot{animation:none;}}
.aiw-panel{position:absolute;bottom:64px;right:0;width:230px;background:#0b0d0e;border:1px solid #262b2e;border-radius:18px;padding:22px 20px 20px;box-shadow:0 34px 64px -20px rgba(0,0,0,0.6);transform-origin:bottom right;transform:scale(0.94) translateY(8px);opacity:0;pointer-events:none;transition:transform .38s cubic-bezier(.16,1,.3,1),opacity .28s ease;}
.aiw-root.is-open .aiw-panel{transform:scale(1) translateY(0);opacity:1;pointer-events:auto;}
.aiw-root.is-open .aiw-fab{color:#e8e8e8;}
.aiw-close{position:absolute;top:14px;right:14px;background:none;border:none;color:#565c60;font-size:18px;cursor:pointer;line-height:1;padding:2px;font-family:inherit;}
.aiw-close:hover{color:#e8e8e8;}
.aiw-panel-head{margin-bottom:20px;padding-right:18px;}
.aiw-panel-title-row{display:flex;align-items:center;gap:7px;margin-bottom:6px;}
.aiw-panel-dot{width:6px;height:6px;border-radius:50%;background:#5fe0af;box-shadow:0 0 0 0 rgba(95,224,175,.6);animation:aiwDotPulse 2.4s infinite;flex-shrink:0;}
@keyframes aiwDotPulse{70%{box-shadow:0 0 0 6px rgba(95,224,175,0);}100%{box-shadow:0 0 0 0 rgba(95,224,175,0);}}
.aiw-panel-title-main{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;font-size:11.5px;font-weight:800;color:#f2f4f5;letter-spacing:.03em;line-height:1.3;}
.aiw-panel-title-sub{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;font-size:10px;color:#868c91;letter-spacing:.03em;}
.aiw-rings{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
.aiw-ring-item{display:flex;align-items:center;gap:12px;text-align:left;}
.aiw-ring-visual{position:relative;width:44px;height:44px;flex-shrink:0;}
.aiw-ring-visual svg{width:100%;height:100%;transform:rotate(-90deg);}
.aiw-ring-track{fill:none;stroke:rgba(255,255,255,0.1);stroke-width:5;}
.aiw-ring-fill{fill:none;stroke:#5fe0af;stroke-width:5;stroke-linecap:round;stroke-dashoffset:106.81;transition:stroke-dashoffset 1s cubic-bezier(.16,1,.3,1);}
.aiw-root.is-open .aiw-ring-fill{stroke-dashoffset:var(--offset);}
.aiw-ring-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;font-size:11px;font-weight:800;color:#f2f4f5;}
.aiw-ring-label{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;font-size:11px;color:#b4b8bc;text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.aiw-note{font-size:10.5px;color:#565c60;line-height:1.5;margin:0 0 14px;}
.aiw-link{display:block;text-align:center;background:#5fe0af;color:#080808;font-weight:700;font-size:12.5px;padding:10px;border-radius:9px;text-decoration:none;font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;transition:background .15s;}
.aiw-link:hover{background:#7ee9be;}
@media(max-width:520px){
  .aiw-root{bottom:16px;right:16px;}
  .aiw-panel{width:calc(100vw - 32px);right:-6px;}
}
</style>

<script>
(function(){
  var root = document.getElementById('aiwRoot');
  if(!root) return;
  var fab = document.getElementById('aiwFab');
  var closeBtn = document.getElementById('aiwClose');
  var heart = document.getElementById('aiwHeartPulse');
  function restartHeartbeat(){
    if (!heart) return;
    heart.style.animation = 'none';
    void heart.getBBox();
    heart.style.animation = '';
  }
  function setOpen(open){
    root.classList.toggle('is-open', open);
    fab.setAttribute('aria-expanded', open ? 'true' : 'false');
    restartHeartbeat();
  }
  fab.addEventListener('click', function(){ setOpen(!root.classList.contains('is-open')); });
  if (closeBtn) {
    closeBtn.addEventListener('click', function(e){ e.stopPropagation(); setOpen(false); });
  }
  document.addEventListener('click', function(e){
    if (root.classList.contains('is-open') && !root.contains(e.target)) setOpen(false);
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') setOpen(false);
  });
})();
</script>
<!-- AIW_LIVE:START -->
<script>
(function(){
  // Pulls real numbers for the AI signal widget from the shop_ai_visits log
  // (via /webhook/shop-ai-signal) and replaces the static placeholder values
  // baked into the markup above. Ring order in the DOM is fixed: Today,
  // Bots, Last seen -- selected positionally, no id changes needed.
  var ringsRoot = document.querySelector('.aiw-rings');
  if (!ringsRoot) return;
  var items = ringsRoot.querySelectorAll('.aiw-ring-item');
  if (items.length < 3) return;
  var todayValue = items[0].querySelector('.aiw-ring-value');
  var todayFill  = items[0].querySelector('.aiw-ring-fill');
  var botsValue  = items[1].querySelector('.aiw-ring-value');
  var botsFill   = items[1].querySelector('.aiw-ring-fill');
  var lastValue  = items[2].querySelector('.aiw-ring-value');
  var lastFill   = items[2].querySelector('.aiw-ring-fill');
  var noteEl = document.querySelector('.aiw-note');
  var CIRC = 106.81;

  function setFill(el, fraction){
    if (!el) return;
    var f = Math.max(0, Math.min(1, fraction || 0));
    el.style.setProperty('--offset', (CIRC * (1 - f)).toFixed(2));
  }
  function relTime(iso){
    if (!iso) return '\u2014';
    var diffMs = Date.now() - new Date(iso).getTime();
    if (isNaN(diffMs)) return '\u2014';
    var mins = Math.max(0, Math.round(diffMs / 60000));
    if (mins < 1) return 'now';
    if (mins < 60) return mins + 'm';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h';
    var days = Math.round(hrs / 24);
    return days + 'd';
  }

  fetch('https://n8n-production-1d7c.up.railway.app/webhook/shop-ai-signal', { headers: { 'Accept': 'application/json' } })
    .then(function(r){ if (!r.ok) throw new Error('bad status'); return r.json(); })
    .then(function(data){
      var visits = Number(data.today_count) || 0;
      var agents = Number(data.unique_agents) || 0;
      var lastSeen = data.last_seen || null;
      if (todayValue) todayValue.textContent = visits.toLocaleString('en-US');
      setFill(todayFill, visits / 30);
      if (botsValue) botsValue.textContent = String(agents);
      setFill(botsFill, agents / 12);
      if (lastValue) lastValue.textContent = relTime(lastSeen);
      var minsAgo = lastSeen ? (Date.now() - new Date(lastSeen).getTime()) / 60000 : null;
      setFill(lastFill, minsAgo == null ? 0 : (1 - Math.min(minsAgo / 120, 1)));
      if (noteEl) noteEl.textContent = 'Live AI crawler activity on atomfoundry.dev.';
    })
    .catch(function(){
      if (noteEl) noteEl.textContent = 'Live signal temporarily unavailable.';
    });
})();
</script>
<!-- AIW_LIVE:END -->
