<!DOCTYPE html>
<html>
<head>
  <title>Monitoring</title>
</head>
<body style="font-family: Arial; padding: 20px; max-width: 800px; margin: auto;">

  <h1 id="store"></h1>

  <h2 id="score"></h2>
  <p id="status" style="font-weight: bold;"></p>
  <p id="loss"></p>

  <h3>Issues:</h3>
  <ul id="issues"></ul>

  <h3>History:</h3>
  <ul id="history"></ul>

<script>
const url = window.location.pathname.split("/");
const token = url[url.length - 1];

fetch(`https://n8n-production-d989b.up.railway.app/webhook/monitoring?token=${token}`)
  .then(res => res.json())
  .then(data => {

    document.getElementById("store").innerText = data.store;
    document.getElementById("score").innerText = "Score: " + data.score;
    document.getElementById("loss").innerText = "Loss: $" + data.monthly_loss;

    // 🔥 STATUS
    const statusEl = document.getElementById("status");

    if (data.status === "improving") {
      statusEl.innerText = "Status: improving 📈";
      statusEl.style.color = "green";
    } else if (data.status === "declining") {
      statusEl.innerText = "Status: declining 📉";
      statusEl.style.color = "red";
    } else {
      statusEl.innerText = "Status: stable";
      statusEl.style.color = "gray";
    }

    // Issues
    const issues = document.getElementById("issues");
    issues.innerHTML = "";

    data.issues.forEach(i => {
      const li = document.createElement("li");
      li.innerText = i;
      issues.appendChild(li);
    });

    // History
    const history = document.getElementById("history");
    history.innerHTML = "";

    data.history.forEach(h => {
      const li = document.createElement("li");
      li.innerText = new Date(h.created_at).toLocaleDateString() + " → " + h.score;
      history.appendChild(li);
    });

  });
</script>

</body>
</html>
